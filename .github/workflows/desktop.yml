name: Desktop App

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
      - "feat/desktop-client-foundation"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    name: Desktop build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os: ubuntu-24.04
            bundles: deb
          - platform: windows
            os: windows-latest
            bundles: msi
          - platform: macos
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Generate desktop icons from the official app mark
        run: npx --yes @tauri-apps/cli@^2 icon public/icons/shadecode-student-512.png --output desktop/icons

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Compile desktop client
        run: cargo check --manifest-path desktop/Cargo.toml

      - name: Run desktop tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build desktop installer
        working-directory: desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-desktop-${{ matrix.platform }}
          path: desktop/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
