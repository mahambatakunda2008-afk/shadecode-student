name: Desktop App

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
      - "feat/desktop-client-foundation"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    name: Desktop compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Compile desktop client
        run: cargo check --manifest-path desktop/Cargo.toml

      - name: Run desktop tests
        run: cargo test --manifest-path desktop/Cargo.toml
