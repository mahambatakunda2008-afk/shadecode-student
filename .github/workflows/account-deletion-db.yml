name: Account deletion database contract

on:
  push:
    branches: [feat/account-deletion-job-foundation]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/account_deletion_contract.sql"
      - ".github/workflows/account-deletion-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/account_deletion_contract.sql"
      - ".github/workflows/account-deletion-db.yml"

permissions:
  contents: read

concurrency:
  group: account-deletion-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Apply migrations and verify deletion contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize disposable local Supabase config
        run: supabase init --force

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Apply every repository migration to the disposable database
        run: supabase db reset

      - name: Run account-deletion SQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/account_deletion_contract.sql

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
