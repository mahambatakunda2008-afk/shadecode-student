name: Mobile layout checks

# Opens the live app in a real phone-sized Chromium and asserts layout rules (no sideways scroll, sticky header,
# bottom nav visible, touch-target sizes). Run it after a deploy. Measurements appear as annotations on the run and
# full-page screenshots are attached as an artifact, so you can review the phone layout without any device.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "App URL to check (ignored in local-dev mode)"
        required: true
        default: "https://shadecodestudent.vercel.app"
      mode:
        description: "production = test base_url with the E2E account; local-dev = start the dev server in CI (public pages only, readable React errors)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - local-dev
          - local-prod
      ref:
        description: "Git ref (branch/tag/sha) whose app code to test in local-dev / local-prod modes. Tests always come from main."
        required: false
        default: "main"

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'production' && 'main' || inputs.ref }}
          fetch-depth: 0

      - name: Overlay the tests from main
        if: inputs.mode != 'production' && inputs.ref != 'main'
        run: |
          git fetch origin main
          git checkout origin/main -- e2e playwright.config.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile layout checks (production)
        if: inputs.mode == 'production'
        env:
          BASE_URL: ${{ inputs.base_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/mobile --reporter=github,list --retries=0

      - name: Run mobile layout checks (local dev server)
        if: inputs.mode == 'local-dev'
        env:
          START_SERVER: "1"
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test e2e/mobile --reporter=github,list --retries=0

      - name: Build and start the app (local production build)
        if: inputs.mode == 'local-prod'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          (npx next start -p 3000 > next-start.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done

      - name: Run mobile layout checks (local production build)
        if: inputs.mode == 'local-prod'
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/mobile --reporter=github,list --retries=0

      - name: Publish measurements as annotations
        if: always()
        run: |
          node -e "
          const fs=require('fs');
          const files=['mobile-metrics/metrics.json','mobile-metrics/style-probe.json'].filter(f=>fs.existsSync(f));
          if(!files.length){console.log('::warning title=Mobile metrics::no metrics file was written');process.exit(0)}
          for(const m of files.flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')))){
            const {page,...rest}=m;
            console.log('::notice title=mobile '+page+'::'+JSON.stringify(rest).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'));
          }"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-${{ github.run_number }}
          path: |
            mobile-metrics/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
