name: 🧠 Cortex Engine — Auto Improve

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

jobs:
  cortex-cycle:
    name: Run Cortex Autonomous Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 lacks native WebSocket support, and
          # @supabase/supabase-js unconditionally initializes a Realtime
          # client on createClient() even though this script never uses
          # realtime features (no .channel()/.subscribe() anywhere) --
          # that crashed every run with "Node.js 20 detected without
          # native WebSocket support" before ever reaching real work.
          # Node 22 has native WebSocket support, avoiding this entirely.
          node-version: "22"

      - name: Install Cortex Engine dependencies
        run: |
          cd .cortex
          npm install

      - name: Run Cortex Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .cortex
          node cortex-engine.js
