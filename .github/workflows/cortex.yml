name: 🧠 Cortex Engine — Auto Improve

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  cortex-cycle:
    name: Run Cortex Autonomous Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cortex Engine dependencies
        run: |
          cd .cortex
          npm install

      - name: Validate Cortex Engine syntax
        run: node --check .cortex/cortex-engine.js

      - name: Run Cortex Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node .cortex/cortex-engine.js
