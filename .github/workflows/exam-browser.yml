name: Exam Simulation browser verification

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Exact subject configured on the E2E account"
        required: true
        type: string
      topic:
        description: "Optional exam topic"
        required: false
        type: string

jobs:
  exam-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Exam Simulation
        env:
          BASE_URL: https://shadecodestudent.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EXAM_SUBJECT: ${{ inputs.subject }}
          E2E_EXAM_TOPIC: ${{ inputs.topic }}
        run: npm run test:exam:e2e

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-browser-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
