name: Curriculum Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official curriculum sources
        run: npx tsx scripts/curriculum-watch.mjs

      - name: Publish watcher report
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-watch-report
          path: .curriculum-watch/latest-report.json
          if-no-files-found: error
