name: Curriculum Watch

on:
  workflow_dispatch:
  push:
    paths:
      - "src/lib/curriculum/**"
      - "scripts/curriculum-*.mjs"
      - ".github/workflows/curriculum-watch.yml"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CURRICULUM_INGEST_ENABLED: ${{ secrets.CURRICULUM_INGEST_ENABLED }}
  SUPABASE_URL: ${{ secrets.CURRICULUM_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CURRICULUM_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run curriculum intelligence tests
        run: npx vitest run src/lib/curriculum

      - name: Check official curriculum sources
        run: npm run watch:curriculum

      - name: Persist detected source/document changes
        if: ${{ env.CURRICULUM_INGEST_ENABLED == 'true' }}
        run: npm run ingest:curriculum

      - name: Publish watcher report
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-watch-report
          path: .curriculum-watch/latest-report.json
          if-no-files-found: error
