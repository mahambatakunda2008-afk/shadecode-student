name: Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "android-v*"
    paths:
      - "android/**"
      - "public/brand/**"
      - "scripts/generate-brand-assets.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: write

env:
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: "0.2.0"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare production signing key
        if: env.HAS_ANDROID_SIGNING == 'true'
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shadecode-release.jks"
          test -s "$RUNNER_TEMP/shadecode-release.jks"

      - name: Validate Android project
        run: gradle projects --stacktrace --no-daemon

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare debug APK
        working-directory: .
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/ShadecodeStudent-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-android-debug-${{ github.run_number }}
          path: dist/android/ShadecodeStudent-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK and Play Store bundle
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shadecode-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleReleaseApk :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare signed release files
        if: env.HAS_ANDROID_SIGNING == 'true'
        working-directory: .
        run: |
          cp android/app/build/outputs/apk/releaseApk/app-releaseApk.apk dist/android/ShadecodeStudent-Android.apk
          cp android/app/build/outputs/bundle/release/*.aab dist/android/ShadecodeStudent-Android.aab

      - name: Upload signed release APK
        if: env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-android-release-${{ github.run_number }}
          path: dist/android/ShadecodeStudent-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB
        if: env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-android-aab-${{ github.run_number }}
          path: dist/android/ShadecodeStudent-Android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Refuse unsigned tagged production release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.HAS_ANDROID_SIGNING != 'true'
        run: |
          echo "Production Android releases require signing secrets." >&2
          echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before pushing an android-v* tag." >&2
          exit 1

      - name: Publish tagged Android release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.HAS_ANDROID_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shadecode Student ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/android/ShadecodeStudent-Android.apk
            dist/android/ShadecodeStudent-Android.aab
          body: |
            ## Shadecode Student Android

            Official native Android distribution for Shadecode Student.

            - APK: direct installation
            - AAB: Google Play publishing bundle
            - Package: `com.shadecode.student`
            - UI: Jetpack Compose

            Do not install Android packages from unofficial mirrors.
