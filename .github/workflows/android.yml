name: Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android project
        run: gradle projects --stacktrace --no-daemon

      - name: Build installable release APK
        run: gradle :app:assembleReleaseApk --stacktrace --no-daemon

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/releaseApk/app-releaseApk.apk app/ShadecodeStudent-Android-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-apk
          path: android/app/ShadecodeStudent-Android-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadecode-student-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create draft GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-${{ github.run_number }}
          name: Shadecode Student Android Preview ${{ github.run_number }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: android/app/ShadecodeStudent-Android-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit android-preview-${{ github.run_number }} --draft=false --prerelease=true
