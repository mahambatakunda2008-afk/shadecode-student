name: CI

on:
  push:
    branches: [main, fix/exam-hub-subject-access, fix/library-subject-access-followup]
  pull_request:
    branches: [main, fix/exam-hub-subject-access]

jobs:
  teacher-security-migration:
    name: Teacher trigger privilege migration (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadecode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated trigger fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema auth;
          create table public.teacher_tutorials (id bigint primary key, status text not null);
          create function public.guard_teacher_tutorial_transition()
          returns trigger language plpgsql security definer
          as $guard$
          begin
            if new.status = 'published' then
              raise exception 'fixture guard rejects publishing without review';
            end if;
            return new;
          end;
          $guard$;
          grant execute on function public.guard_teacher_tutorial_transition() to public, anon, authenticated, service_role;
          create trigger teacher_tutorial_transition_guard
            before update on public.teacher_tutorials
            for each row execute function public.guard_teacher_tutorial_transition();
          SQL
      - name: Apply trigger-only privilege migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170000_revoke_direct_teacher_tutorial_guard_execute.sql
      - name: Assert API roles cannot invoke guard and trigger remains attached
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/tests/teacher_tutorial_guard_privileges.test.sql
      - name: Prove trigger still executes after direct grants are revoked
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.teacher_tutorials (id, status) values (1, 'draft');
          update public.teacher_tutorials set status = 'review' where id = 1;
          do $assert$
          begin
            begin
              update public.teacher_tutorials set status = 'published' where id = 1;
              raise exception 'expected trigger to reject protected transition';
            exception when raise_exception then
              if sqlerrm = 'expected trigger to reject protected transition' then raise; end if;
            end;
          end $assert$;
          SQL
      - name: Prepare isolated platform schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 <<'SQL'
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid
            language sql stable
            as $uid$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $uid$;
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
      - name: Apply recovered platform relationships baseline
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260911112810_create_platform_relationships.sql
      - name: Verify recovered platform schema and RLS baseline
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/tests/platform_relationships_baseline.test.sql
      - name: Apply institution-scoped lifecycle migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115100000_platform_institution_lifecycle.sql
      - name: Test institution onboarding, invitations, roles and revocation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test -v ON_ERROR_STOP=1 -f supabase/tests/platform_institution_lifecycle.test.sql

  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate brand raster assets
        run: npm run generate:brand

      - name: Normalize Lucide icon sizes
        run: node scripts/snap-icon-sizes.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
