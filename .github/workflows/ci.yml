name: CI

on:
  push:
    branches: [main, fix/exam-hub-subject-access, fix/library-subject-access-followup]
  pull_request:
    branches: [main, fix/exam-hub-subject-access]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate brand raster assets
        run: npm run generate:brand

      - name: Normalize Lucide icon sizes
        run: node scripts/snap-icon-sizes.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  account_deletion_database:
    name: Account deletion database contract
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/account-deletion-job-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize disposable local Supabase config
        run: supabase init --force

      - name: Start disposable Supabase stack
        run: supabase start

      - name: Apply every repository migration to the disposable database
        run: supabase db reset

      - name: Run account-deletion SQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/account_deletion_contract.sql

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
