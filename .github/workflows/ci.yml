name: CI

on:
  push:
    branches: [main, fix/exam-hub-subject-access, fix/library-subject-access-followup]
  pull_request:
    branches: [main, fix/exam-hub-subject-access]

jobs:
  security_execute_grants_contract:
    name: Trigger and answer-key grant contract
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/security-definer-trigger-grants'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.0.0

      - name: Initialize isolated Supabase fixture
        run: |
          supabase init --force
          mkdir -p supabase/migrations
          cp supabase/tests/fixtures/security_execute_grants_schema.sql /tmp/security_execute_grants_schema.sql
          cp supabase/migrations/20261116101500_restrict_trigger_and_answer_key_grants.sql /tmp/security_execute_grants_migration.sql
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete
          cp /tmp/security_execute_grants_schema.sql supabase/migrations/20261101000000_security_execute_grants_test_baseline.sql
          cp /tmp/security_execute_grants_migration.sql supabase/migrations/20261116101500_restrict_trigger_and_answer_key_grants.sql

      - name: Start disposable Supabase database
        run: supabase start

      - name: Verify trigger and answer-key grant contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/security_execute_grants_contract.sql

      - name: Stop disposable Supabase database
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate brand raster assets
        run: npm run generate:brand

      - name: Normalize Lucide icon sizes
        run: node scripts/snap-icon-sizes.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
