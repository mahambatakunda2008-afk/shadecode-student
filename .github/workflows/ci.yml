name: CI

on:
  push:
    branches: [main, fix/exam-hub-subject-access, fix/library-subject-access-followup]
  pull_request:
    branches: [main, fix/exam-hub-subject-access]

jobs:
  profile_privacy_contract:
    name: Profile privacy database contract
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/profile-privacy-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.0.0

      - name: Initialize isolated Supabase fixture
        run: |
          supabase init --force
          mkdir -p supabase/migrations
          cp supabase/tests/fixtures/profile_privacy_schema.sql /tmp/profile_privacy_schema.sql
          cp supabase/migrations/20261116000200_profiles_private_read_leaderboard_projection.sql /tmp/profile_privacy_migration.sql
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete
          cp /tmp/profile_privacy_schema.sql supabase/migrations/20261101000000_profile_privacy_test_baseline.sql
          cp /tmp/profile_privacy_migration.sql supabase/migrations/20261116000200_profiles_private_read_leaderboard_projection.sql

      - name: Start disposable Supabase database
        run: supabase start

      - name: Verify profile privacy contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/profile_privacy_contract.sql

      - name: Stop disposable Supabase database
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

  security_execute_grants_contract:
    name: Trigger and answer-key grant contract
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/security-definer-trigger-grants'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadecode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare isolated security fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 \
            --file supabase/tests/fixtures/security_execute_grants_schema.sql

      - name: Apply least-privilege migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20261116101500_restrict_trigger_and_answer_key_grants.sql

      - name: Verify grants and prove trigger execution
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 \
            --file supabase/tests/security_execute_grants_contract.sql

  generated_lesson_sync_contract:
    name: Generated lesson sync database contract
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/sync-lesson-topic-preserve-progress-mainline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadecode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadecode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated lesson sync schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 --file supabase/tests/fixtures/sync_generated_lesson_schema.sql
      - name: Apply current progress-preserving sync contract
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261122170000_sync_lesson_progress_without_overwriting_content.sql
      - name: Apply generated lesson topic migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261125160000_sync_generated_lesson_topic_preserve_progress.sql
      - name: Verify topic, difficulty and execute-grant contract
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shadecode_test --set ON_ERROR_STOP=1 --file supabase/tests/sync_generated_lesson_topic_preserves_progress.test.sql

  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate brand raster assets
        run: npm run generate:brand

      - name: Normalize Lucide icon sizes
        run: node scripts/snap-icon-sizes.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
