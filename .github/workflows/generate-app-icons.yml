name: Generate app icon rasters

on:
  workflow_dispatch:
  push:
    branches:
      - polish-app-icon-centering-20261023
    paths:
      - "public/icons/shadecode-student.svg"
      - "public/brand/**/*.svg"
      - "src/app/icon.svg"
      - "src/app/apple-icon.svg"
      - "scripts/generate-app-icons.py"
      - "scripts/generate-brand-assets.mjs"
      - ".github/workflows/generate-app-icons.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run generate:brand
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cairosvg pillow
      - run: python scripts/generate-app-icons.py
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/*.png
          if git diff --cached --quiet; then
            echo "Icon PNGs are already up to date."
          else
            git commit -m "Generate app icon PNGs from folded S artwork"
            git push origin HEAD:${{ github.ref_name }}
          fi
