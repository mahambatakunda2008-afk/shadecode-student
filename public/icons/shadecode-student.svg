<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shadecode Student</title>
  <desc id="desc">A smooth blue-violet ribbon forming an S and an open book, centered on a deep navy background.</desc>
  <defs>
    <linearGradient id="ribbon" x1="300" y1="300" x2="730" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39E5F5"/>
      <stop offset=".34" stop-color="#168BFF"/>
      <stop offset=".68" stop-color="#385BFF"/>
      <stop offset="1" stop-color="#9A5BFF"/>
    </linearGradient>
    <linearGradient id="pages" x1="390" y1="500" x2="650" y2="640" gradientUnits="userSpaceOnUse">
