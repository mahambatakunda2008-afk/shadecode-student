<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Competitive and non-competitive inhibition</title><desc id="desc">Conceptual rate versus substrate concentration curves for no inhibitor, competitive inhibition and pure non-competitive inhibition.</desc><rect x="12" y="12" width="936" height="536" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px}.line{stroke:#0f172a;stroke-width:4;fill:none;stroke-linecap:round}.axis{stroke:#334155;stroke-width:3;fill:none}.enzyme{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.sub{fill:#fde68a;stroke:#b45309;stroke-width:3}.product{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none}</style>
<text x="480" y="55" text-anchor="middle" class="h">Reversible inhibition: compare kinetic effects</text>
<path d="M130 455 L850 455 M130 455 L130 105" class="axis"/><text x="490" y="520" text-anchor="middle" class="t">Substrate concentration</text><text x="65" y="280" text-anchor="middle" class="t" transform="rotate(-90 65 280)">Initial rate</text>
<path d="M130 455 C200 250 300 165 440 135 S700 120 840 120" stroke="#1d4ed8" stroke-width="5" fill="none"/><text x="660" y="100" class="t">No inhibitor</text>
<path d="M130 455 C230 350 350 230 500 165 S720 120 840 120" stroke="#b45309" stroke-width="5" fill="none"/><text x="660" y="160" class="t">Competitive</text>
<path d="M130 455 C210 320 330 260 460 245 S700 235 840 235" stroke="#15803d" stroke-width="5" fill="none"/><text x="660" y="275" class="t">Pure non-competitive</text>
<path d="M130 120 L840 120" class="dash"/><path d="M130 235 L840 235" class="dash"/>
<text x="480" y="85" text-anchor="middle" class="small">Conceptual curves: competitive inhibition can still reach Vmax; pure non-competitive inhibition lowers Vmax</text>
</svg>