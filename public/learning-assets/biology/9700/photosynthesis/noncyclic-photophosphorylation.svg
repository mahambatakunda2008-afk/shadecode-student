<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Non-cyclic photophosphorylation</title><desc id="desc">PSII and PSI; water photolysis supplies electrons; electrons reduce NADP; ATP and oxygen produced.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Non-cyclic photophosphorylation</text>
