<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Chemiosmosis across the thylakoid membrane</title><desc id="desc">Protons accumulate in thylakoid space and flow through ATP synthase back to stroma.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Chemiosmosis across the thylakoid membrane</text>
<rect x="90" y="130" width="720" height="115" rx="18" fill="#e6f2fb"/><text x="115" y="175" font-family="Arial" font-size="25">Thylakoid space: high H⁺ concentration</text><rect x="90" y="250" width="720" height="35" fill="#4f9d78"/><text x="115" y="275" font-family="Arial" font-size="17" fill="#fff">Thylakoid membrane</text><rect x="410" y="230" width="90" height="75" rx="14" fill="#fff0cf" stroke="#9c6b25" stroke-width="3"/><text x="455" y="275" text-anchor="middle" font-family="Arial" font-size="18">ATP</text><path d="M455 125 V225" stroke="#2576a8" stroke-width="7"/><path d="M443 210 L455 225 L467 210" fill="none" stroke="#2576a8" stroke-width="6"/><text x="520" y="220" font-family="Arial" font-size="18">ATP synthase</text><text x="115" y="370" font-family="Arial" font-size="25">Stroma: lower H⁺ concentration</text><text x="115" y="410" font-family="Arial" font-size="19">H⁺ flow drives ADP + Pi → ATP</text><text x="40" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>