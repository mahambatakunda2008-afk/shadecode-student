<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">DCPIP and chloroplast investigation</title><desc id="desc">Equal chloroplast and DCPIP samples exposed to controlled light; decolourisation indicates reduction of DCPIP.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">DCPIP and chloroplast investigation</text>
<rect x="90" y="170" width="190" height="100" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="185" y="227" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Lamp / LED</text><rect x="350" y="170" width="210" height="100" rx="14" fill="#d9eafa" stroke="#276678" stroke-width="3"/><text x="455" y="227" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Chloroplast + DCPIP</text><rect x="650" y="170" width="170" height="100" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="735" y="227" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Colorimeter</text><path d="M280 220 L350 220" stroke="#236b87" stroke-width="4" fill="none"/><path d="M340 212 L350 220 L340 228" stroke="#236b87" stroke-width="4" fill="none"/><text x="315" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">light</text><path d="M560 220 L650 220" stroke="#236b87" stroke-width="4" fill="none"/><path d="M640 212 L650 220 L640 228" stroke="#236b87" stroke-width="4" fill="none"/><text x="605" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">sample</text><rect x="150" y="350" width="220" height="65" rx="14" fill="#eeeeee" stroke="#276678" stroke-width="3"/><text x="260" y="389.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Dark control</text><rect x="500" y="350" width="220" height="65" rx="14" fill="#eeeeee" stroke="#276678" stroke-width="3"/><text x="610" y="389.5" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Boiled chloroplast control</text><text x="350" y="310" font-family="Arial" font-size="18">Blue → colourless as DCPIP is reduced</text><text x="40" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>