<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Cyclic photophosphorylation</title><desc id="desc">PSI alone; excited electrons pass through carriers and return to PSI; ATP is produced.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Cyclic photophosphorylation</text>
<rect x="100" y="200" width="170" height="90" rx="14" fill="#d9eafa" stroke="#276678" stroke-width="3"/><text x="185" y="252" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">PSI</text><rect x="380" y="200" width="180" height="90" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="470" y="252" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">Electron carriers</text><rect x="680" y="200" width="130" height="90" rx="14" fill="#d9eafa" stroke="#276678" stroke-width="3"/><text x="745" y="252" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">PSI</text><path d="M270 245 L380 245" stroke="#236b87" stroke-width="4" fill="none"/><path d="M370 237 L380 245 L370 253" stroke="#236b87" stroke-width="4" fill="none"/><text x="325" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">e−</text><path d="M560 245 L680 245" stroke="#236b87" stroke-width="4" fill="none"/><path d="M670 237 L680 245 L670 253" stroke="#236b87" stroke-width="4" fill="none"/><text x="620" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">e−</text><path d="M745 290 L180 390" stroke="#236b87" stroke-width="4" fill="none"/><path d="M170 382 L180 390 L170 398" stroke="#236b87" stroke-width="4" fill="none"/><text x="462.5" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">electron returns</text><rect x="350" y="380" width="200" height="70" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="450" y="422" text-anchor="middle" font-family="Arial" font-size="20" fill="#123047">ATP formed</text><path d="M470 335 L450 380" stroke="#236b87" stroke-width="4" fill="none"/><path d="M440 372 L450 380 L440 388" stroke="#236b87" stroke-width="4" fill="none"/><text x="460" y="347.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#123047">proton gradient</text><text x="100" y="150" font-family="Arial" font-size="21">Light</text><path d="M150 160 L180 200" stroke="#df8b2d" stroke-width="5"/><text x="40" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>