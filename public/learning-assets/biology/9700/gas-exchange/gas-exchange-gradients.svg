<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Gas exchange partial pressure gradients</title><desc id="desc">Opposing oxygen and carbon dioxide partial pressure gradients across alveolar and capillary walls.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><rect x="100" y="130" width="300" height="320" rx="18" fill="#fce7e7" stroke="#263746" stroke-width="3"/><rect x="600" y="130" width="300" height="320" rx="18" fill="#dbeafe" stroke="#263746" stroke-width="3"/><rect x="455" y="130" width="90" height="320" fill="#f3f4f6" stroke="#263746" stroke-width="3"/><g font-size="24" text-anchor="middle"><text x="250" y="185">Alveolar air</text><text x="750" y="185">Capillary blood</text><text x="500" y="490" font-size="18">Thin exchange barrier</text></g><path d="M310 260H680" stroke="#dc2626" stroke-width="10"/><path d="M680 260l-25 -18v36Z" fill="#dc2626"/><path d="M690 350H300" stroke="#2563eb" stroke-width="10"/><path d="M300 350l25 -18v36Z" fill="#2563eb"/><g font-size="23"><text x="420" y="235" fill="#dc2626">O₂</text><text x="420" y="395" fill="#2563eb">CO₂</text><text x="500" y="555" text-anchor="middle" font-size="18">Each gas diffuses down its own partial pressure gradient</text></g></g></svg>