<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Human gas exchange system</title><desc id="desc">Schematic pathway from trachea through bronchi and bronchioles to alveoli, with capillary network.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#263746" stroke-width="5" fill="none"><path d="M500 70V220M500 220L390 300M500 220L610 300M390 300L330 390M390 300L430 390M610 300L570 390M610 300L670 390" /><path d="M500 90Q390 40 320 180Q260 320 350 480Q420 545 490 490M500 90Q610 40 680 180Q740 320 650 480Q580 545 510 490" stroke="#dc7777" stroke-width="8"/><path d="M500 70V190" stroke="#2563eb" stroke-width="16"/></g><g fill="#f4c6c6" stroke="#263746" stroke-width="3"><ellipse cx="290" cy="460" rx="28" ry="20"/><ellipse cx="350" cy="500" rx="28" ry="20"/><ellipse cx="650" cy="500" rx="28" ry="20"/><ellipse cx="710" cy="460" rx="28" ry="20"/></g><g font-size="22"><text x="530" y="80">Trachea</text><text x="250" y="260">Left bronchus</text><text x="650" y="260">Right bronchus</text><text x="230" y="370">Bronchioles</text><text x="750" y="370">Bronchioles</text><text x="410" y="570">Alveoli with surrounding capillaries</text><text x="500" y="35" text-anchor="middle" font-size="17">Airflow pathway (schematic)</text></g></g></svg>