<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Alveolar-capillary exchange surface</title><desc id="desc">Alveolus with adjacent capillary and thin walls, showing oxygen diffusion into blood and carbon dioxide diffusion into alveolar air.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><ellipse cx="460" cy="290" rx="250" ry="170" fill="#f7dede" stroke="#263746" stroke-width="5"/><path d="M220 320Q460 430 700 320" stroke="#2563eb" stroke-width="35" fill="none"/><path d="M220 320Q460 430 700 320" stroke="#fff" stroke-width="4" fill="none"/><g stroke-width="7" fill="none"><path d="M400 265L350 175" stroke="#dc2626"/><path d="M520 315L575 405" stroke="#2563eb"/></g><g font-size="22"><text x="380" y="90">Alveolar air space</text><text x="280" y="490">Capillary containing blood</text><text x="560" y="170" fill="#dc2626">O₂ into blood</text><text x="565" y="435" fill="#2563eb">CO₂ into alveolus</text><text x="450" y="565" text-anchor="middle" font-size="17">Thin squamous alveolar epithelium + capillary endothelium</text></g></g></svg>