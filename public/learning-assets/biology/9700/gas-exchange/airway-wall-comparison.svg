<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Airway wall comparison</title><desc id="desc">Schematic cross-sections of trachea, bronchus and bronchiole showing cartilage and smooth muscle differences.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#263746" stroke-width="4"><circle cx="190" cy="260" r="125" fill="#f5d0d0"/><circle cx="190" cy="260" r="65" fill="#fff"/><path d="M95 180Q190 90 285 180" stroke="#2563eb" stroke-width="18" fill="none"/><circle cx="500" cy="260" r="115" fill="#f5d0d0"/><circle cx="500" cy="260" r="62" fill="#fff"/><g fill="#2563eb"><ellipse cx="500" cy="150" rx="32" ry="15"/><ellipse cx="395" cy="220" rx="25" ry="14"/><ellipse cx="600" cy="220" rx="25" ry="14"/><ellipse cx="450" cy="365" rx="25" ry="14"/></g><circle cx="810" cy="260" r="90" fill="#f5d0d0"/><circle cx="810" cy="260" r="52" fill="#fff"/><circle cx="810" cy="260" r="75" fill="none" stroke="#16a34a" stroke-width="12"/></g><g font-size="22" text-anchor="middle"><text x="190" y="440">Trachea</text><text x="500" y="440">Bronchus</text><text x="810" y="440">Bronchiole</text><text x="500" y="500" font-size="18">Cartilage: rings in trachea, plates in bronchi, absent in bronchioles</text><text x="500" y="535" font-size="18">Smooth muscle is present in airway walls and regulates lumen diameter</text></g></g></svg>