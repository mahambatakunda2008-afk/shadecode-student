<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Airway tissue recognition</title><desc id="desc">Schematic visual key for ciliated epithelium, goblet cells, cartilage, smooth muscle, alveolar squamous lining and capillaries.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#263746" stroke-width="3"><rect x="65" y="110" width="400" height="155" rx="12" fill="#f7e2c5"/><g fill="#d4a5a5"><rect x="95" y="145" width="45" height="100"/><rect x="150" y="145" width="45" height="100"/><rect x="205" y="145" width="45" height="100"/><rect x="260" y="145" width="45" height="100"/><rect x="315" y="145" width="45" height="100"/></g><g stroke="#2563eb" stroke-width="3"><path d="M95 145l-8 -22m18 22l0 -25m18 25l8 -22M150 145l-8 -22m18 22l0 -25m18 25l8 -22M205 145l-8 -22m18 22l0 -25m18 25l8 -22M260 145l-8 -22m18 22l0 -25m18 25l8 -22M315 145l-8 -22m18 22l0 -25m18 25l8 -22"/></g><ellipse cx="385" cy="190" rx="25" ry="48" fill="#e9a6a6"/><circle cx="650" cy="185" r="80" fill="#c8d5e8"/><g fill="#fff"><circle cx="620" cy="160" r="12"/><circle cx="680" cy="205" r="12"/></g><path d="M550 340Q650 280 750 340" stroke="#16a34a" stroke-width="24" fill="none"/><path d="M80 420Q250 350 430 420" stroke="#dc7777" stroke-width="15" fill="none"/></g><g font-size="20"><text x="65" y="80">Ciliated epithelium and goblet cell</text><text x="565" y="80">Cartilage matrix with chondrocytes</text><text x="560" y="470">Smooth muscle bundle</text><text x="70" y="480">Capillary / blood vessel</text><text x="500" y="550" text-anchor="middle" font-size="17">Alveolar squamous lining: a very thin flattened cell layer</text></g></g></svg>