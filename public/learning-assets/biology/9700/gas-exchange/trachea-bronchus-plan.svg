<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Trachea and bronchus plan diagrams</title><desc id="desc">Simplified plan diagrams of transverse sections of trachea and bronchus showing lumen, epithelial lining and cartilage.</desc><rect width="1000" height="620" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#263746" stroke-width="4"><circle cx="270" cy="260" r="150" fill="#f3d0d0"/><circle cx="270" cy="260" r="90" fill="#fff"/><path d="M150 170Q270 75 390 170" stroke="#2563eb" stroke-width="24" fill="none"/><circle cx="730" cy="260" r="150" fill="#f3d0d0"/><circle cx="730" cy="260" r="90" fill="#fff"/><g fill="#2563eb"><ellipse cx="730" cy="115" rx="38" ry="18"/><ellipse cx="600" cy="205" rx="30" ry="18"/><ellipse cx="860" cy="205" rx="30" ry="18"/><ellipse cx="650" cy="375" rx="30" ry="18"/><ellipse cx="810" cy="375" rx="30" ry="18"/></g></g><g font-size="24" text-anchor="middle"><text x="270" y="465">Trachea TS</text><text x="730" y="465">Bronchus TS</text><text x="500" y="530" font-size="18">Blue: cartilage | pale lining: airway wall | white: lumen</text></g></g></svg>