<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Vaccination reduces transmission opportunities</title><desc id="desc">Conceptual comparison of a largely susceptible population with a population where many individuals are immune, reducing pathways for pathogen spread.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Vaccination reduces transmission opportunities</text><rect x="45" y="105" width="385" height="300" rx="16" fill="#fff" stroke="#27758a" stroke-width="2"/><rect x="470" y="105" width="385" height="300" rx="16" fill="#fff" stroke="#27758a" stroke-width="2"/><text x="237" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123">LOW COVERAGE</text><text x="662" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123">HIGH COVERAGE</text><g fill="#e5a4a4" stroke="#8a3434" stroke-width="2"><circle cx="115" cy="220" r="22"/><circle cx="185" cy="220" r="22"/><circle cx="255" cy="220" r="22"/><circle cx="325" cy="220" r="22"/><circle cx="150" cy="305" r="22"/><circle cx="220" cy="305" r="22"/><circle cx="290" cy="305" r="22"/></g><g fill="#9dd6b2" stroke="#28724a" stroke-width="2"><circle cx="540" cy="220" r="22"/><circle cx="610" cy="220" r="22"/><circle cx="680" cy="220" r="22"/><circle cx="750" cy="220" r="22"/><circle cx="575" cy="305" r="22"/><circle cx="645" cy="305" r="22"/><circle cx="715" cy="305" r="22"/></g><circle cx="540" cy="220" r="22" fill="#e5a4a4" stroke="#8a3434" stroke-width="2"/><path d="M137 220H163 M207 220H233 M277 220H303 M172 305H198 M242 305H268" stroke="#b33c3c" stroke-width="3"/><text x="237" y="385" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">Many susceptible hosts</text><text x="662" y="385" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">Fewer susceptible hosts</text><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">Conceptual model: actual coverage thresholds depend on the disease.</text></svg>