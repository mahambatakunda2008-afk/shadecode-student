<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Types of immunity</title><desc id="desc">Two-by-two classification: active versus passive immunity and natural versus artificial acquisition, with standard examples.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Types of immunity</text><rect x="180" y="125" width="650" height="310" rx="12" fill="#fff" stroke="#27758a" stroke-width="2"/><path d="M505 125V435 M180 280H830" stroke="#9abac5" stroke-width="2"/><g font-family="Arial" fill="#123447"><text x="340" y="160" text-anchor="middle" font-size="20" font-weight="700">NATURAL</text><text x="665" y="160" text-anchor="middle" font-size="20" font-weight="700">ARTIFICIAL</text><text x="95" y="210" font-size="18" font-weight="700">ACTIVE</text><text x="95" y="365" font-size="18" font-weight="700">PASSIVE</text><text x="340" y="215" text-anchor="middle" font-size="17">After infection</text><text x="340" y="245" text-anchor="middle" font-size="15">Own response + memory</text><text x="665" y="215" text-anchor="middle" font-size="17">After vaccination</text><text x="665" y="245" text-anchor="middle" font-size="15">Own response + memory</text><text x="340" y="335" text-anchor="middle" font-size="17">Maternal antibodies</text><text x="340" y="365" text-anchor="middle" font-size="15">Placenta / breast milk</text><text x="665" y="335" text-anchor="middle" font-size="17">Antibody injection</text><text x="665" y="365" text-anchor="middle" font-size="15">e.g. antivenom / immunoglobulin</text></g><text x="505" y="475" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">Active = recipient responds; passive = ready-made antibodies transferred</text></svg>