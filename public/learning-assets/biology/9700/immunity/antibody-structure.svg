<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Antibody structure</title><desc id="desc">Y-shaped antibody with two heavy chains, two light chains, disulfide bonds, variable antigen-binding regions and constant regions.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Antibody structure</text><path d="M450 390 L450 260 L330 125 M450 260 L570 125" stroke="#26758a" stroke-width="38" stroke-linecap="round" fill="none"/><path d="M420 390 L420 255 L300 120 M480 390 L480 255 L600 120" stroke="#b17a38" stroke-width="18" stroke-linecap="round" fill="none"/><path d="M300 120 L330 90 M600 120 L570 90" stroke="#b33c3c" stroke-width="7" stroke-linecap="round"/><path d="M285 100 L205 100" stroke="#b33c3c" stroke-width="2"/><text x="55" y="105" font-family="Arial" font-size="17" fill="#123">Variable regions</text><text x="55" y="130" font-family="Arial" font-size="14" fill="#345">Antigen-binding sites</text><path d="M455 325 L650 325" stroke="#26758a" stroke-width="2"/><text x="660" y="330" font-family="Arial" font-size="17" fill="#123">Constant region</text><path d="M410 260 L260 260" stroke="#b17a38" stroke-width="2"/><text x="55" y="255" font-family="Arial" font-size="17" fill="#123">Heavy chains</text><path d="M320 165 L245 200" stroke="#b17a38" stroke-width="2"/><text x="55" y="210" font-family="Arial" font-size="17" fill="#123">Light chains</text><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#345">Four polypeptide chains held together by disulfide bonds</text></svg>