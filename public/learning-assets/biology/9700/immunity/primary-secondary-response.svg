<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Primary and secondary antibody responses</title><desc id="desc">Schematic graph: secondary exposure to the same antigen produces a shorter lag and a higher antibody concentration due to memory cells.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Primary and secondary antibody responses</text><path d="M105 420V105 M105 420H830" stroke="#123447" stroke-width="3" fill="none"/><text x="40" y="115" font-family="Arial" font-size="16" fill="#123">Antibody</text><text x="40" y="137" font-family="Arial" font-size="16" fill="#123">level</text><text x="445" y="475" text-anchor="middle" font-family="Arial" font-size="17" fill="#123">Time →</text><path d="M110 418 C170 416 185 390 220 335 S300 265 355 360 S440 415 490 410 C530 405 545 260 600 155 S700 115 810 115" fill="none" stroke="#27758a" stroke-width="5"/><path d="M110 418 C170 416 185 390 220 335 S300 265 355 360 S440 415 490 410" fill="none" stroke="#b07827" stroke-width="4" stroke-dasharray="8 6"/><path d="M180 420V390 M500 420V390" stroke="#123" stroke-width="2"/><text x="180" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">First exposure</text><text x="500" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#345">Same antigen again</text><text x="290" y="230" font-family="Arial" font-size="16" fill="#8a5a12">Primary response</text><text x="660" y="95" font-family="Arial" font-size="16" fill="#26758a">Secondary response</text><text x="470" y="500" text-anchor="middle" font-family="Arial" font-size="12" fill="#567">Schematic only; not to scale.</text></svg>