<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Hybridoma method for monoclonal antibodies</title><desc id="desc">Flow diagram of immunising an animal, collecting antibody-producing B cells, fusing with myeloma cells, screening hybridomas and cloning the selected cell.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Hybridoma method for monoclonal antibodies</text><rect x="40" y="125" width="175" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="127.5" y="161" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">IMMUNISE</text><text x="127.5" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Chosen antigen</text><path d="M220 190 L255 190" stroke="#26758a" stroke-width="3" fill="none"/><path d="M246 183 L255 190 L246 197" stroke="#26758a" stroke-width="3" fill="none"/><rect x="265" y="125" width="175" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="352.5" y="161" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">COLLECT B CELLS</text><text x="352.5" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Antibody-producing cells</text><path d="M445 190 L480 190" stroke="#26758a" stroke-width="3" fill="none"/><path d="M471 183 L480 190 L471 197" stroke="#26758a" stroke-width="3" fill="none"/><rect x="490" y="125" width="175" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="577.5" y="161" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">FUSE CELLS</text><text x="577.5" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">With myeloma cells</text><path d="M670 190 L705 190" stroke="#26758a" stroke-width="3" fill="none"/><path d="M696 183 L705 190 L696 197" stroke="#26758a" stroke-width="3" fill="none"/><rect x="715" y="125" width="150" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="790" y="161" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">SCREEN</text><text x="790" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Find desired antibody</text><path d="M790 265 V330 H450 V365" stroke="#26758a" stroke-width="3" fill="none"/><path d="M441 356 L450 365 L459 356" stroke="#26758a" stroke-width="3" fill="none"/><rect x="315" y="365" width="270" height="95" rx="16" fill="#eaf4e8" stroke="#27758a" stroke-width="2"/><text x="450" y="401" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">CLONE & CULTURE</text><text x="450" y="433" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Produce identical antibody</text></svg>