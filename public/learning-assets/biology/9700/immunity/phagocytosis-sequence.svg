<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Phagocytosis: from engulfment to digestion</title><desc id="desc">Four stages: pathogen recognition and attachment, engulfment into a phagosome, lysosome fusion, and enzymatic digestion.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Phagocytosis: from engulfment to digestion</text><rect x="35" y="165" width="185" height="145" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="127.5" y="201" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">1  ATTACH</text><text x="127.5" y="233" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Phagocyte binds pathogen</text><path d="M225 235 L265 235" stroke="#26758a" stroke-width="3" fill="none"/><path d="M256 228 L265 235 L256 242" stroke="#26758a" stroke-width="3" fill="none"/><rect x="275" y="165" width="185" height="145" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="367.5" y="201" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">2  ENGULF</text><text x="367.5" y="233" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Phagosome forms</text><path d="M465 235 L505 235" stroke="#26758a" stroke-width="3" fill="none"/><path d="M496 228 L505 235 L496 242" stroke="#26758a" stroke-width="3" fill="none"/><rect x="515" y="165" width="165" height="145" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="597.5" y="201" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">3  FUSE</text><text x="597.5" y="233" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Lysosome joins</text><path d="M685 235 L725 235" stroke="#26758a" stroke-width="3" fill="none"/><path d="M716 228 L725 235 L716 242" stroke="#26758a" stroke-width="3" fill="none"/><rect x="735" y="165" width="130" height="145" rx="16" fill="#eaf4e8" stroke="#27758a" stroke-width="2"/><text x="800" y="201" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#123447">4  DIGEST</text><text x="800" y="233" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Enzymes act</text><text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="18" fill="#345">Macrophages can then display pathogen antigen fragments to T-helper cells.</text></svg>