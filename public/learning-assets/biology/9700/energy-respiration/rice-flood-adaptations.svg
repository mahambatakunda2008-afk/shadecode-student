<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">rice flood adaptations</title><desc id="desc">Original explanatory schematic for Cambridge Biology 9700 Topic 12.</desc><rect width="900" height="520" fill="#fff"/><text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#123642">rice flood adaptations</text><rect x="55" y="100" width="790" height="68" rx="12" fill="#eef1fa" stroke="#47798a"/><text x="450" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183642">Aerenchyma: air spaces move oxygen to roots</text><rect x="55" y="195" width="790" height="68" rx="12" fill="#eaf4f6" stroke="#47798a"/><text x="450" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183642">Root cells use ethanol fermentation when O2 is scarce</text><rect x="55" y="290" width="790" height="68" rx="12" fill="#eef1fa" stroke="#47798a"/><text x="450" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183642">Faster stem growth keeps shoots above floodwater</text><rect x="55" y="385" width="790" height="68" rx="12" fill="#eaf4f6" stroke="#47798a"/><text x="450" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183642">Fermentation is less energy-efficient</text></svg>