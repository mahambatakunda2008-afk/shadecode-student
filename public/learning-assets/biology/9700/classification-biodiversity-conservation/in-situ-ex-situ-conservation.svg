<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">In situ and ex situ conservation</title><desc id="desc">Original explanatory diagram showing In situ: protect natural habitat, Ex situ: maintain elsewhere, Use together where appropriate.</desc><rect width="900" height="430" rx="20" fill="#f7fbfc"/><text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b4a">In situ and ex situ conservation</text><rect x="95" y="115" width="710" height="58" rx="13" fill="#dff3f6" stroke="#28788b" stroke-width="2"/><text x="450" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#123b4a">In situ: protect natural habitat</text><path d="M450 173 v20" stroke="#28788b" stroke-width="3"/><rect x="95" y="193" width="710" height="58" rx="13" fill="#eaf4e9" stroke="#28788b" stroke-width="2"/><text x="450" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#123b4a">Ex situ: maintain elsewhere</text><path d="M450 251 v20" stroke="#28788b" stroke-width="3"/><rect x="95" y="271" width="710" height="58" rx="13" fill="#dff3f6" stroke="#28788b" stroke-width="2"/><text x="450" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#123b4a">Use together where appropriate</text></svg>