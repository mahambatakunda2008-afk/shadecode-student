<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Blood cell recognition</title><desc id="desc">Schematic red blood cell, monocyte, neutrophil and lymphocyte with distinguishing cell and nucleus shapes.</desc><rect width="1000" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b" stroke="#263746" stroke-width="3"><ellipse cx="130" cy="220" rx="78" ry="48" fill="#dc7777"/><ellipse cx="130" cy="220" rx="34" ry="18" fill="#f7b5b5"/><circle cx="365" cy="220" r="72" fill="#f1d5c4"/><path d="M320 215Q330 165 375 180Q415 190 390 225Q365 265 335 245Z" fill="#6b4c7a"/><circle cx="615" cy="220" r="72" fill="#f1d5c4"/><path d="M560 210Q565 165 600 190Q620 160 640 190Q680 180 665 220Q680 250 640 245Q615 270 595 245Q560 255 560 210Z" fill="#6b4c7a"/><circle cx="855" cy="220" r="72" fill="#f1d5c4"/><circle cx="855" cy="220" r="55" fill="#6b4c7a"/><g stroke="none" font-size="22" text-anchor="middle"><text x="130" y="350">Red blood cell</text><text x="365" y="350">Monocyte</text><text x="615" y="350">Neutrophil</text><text x="855" y="350">Lymphocyte</text><text x="500" y="435" font-size="18">Schematic recognition guide, not to scale</text><text x="500" y="475" font-size="18">Red cell: biconcave, no nucleus</text><text x="500" y="505" font-size="18">Monocyte: indented nucleus | Neutrophil: multi-lobed nucleus | Lymphocyte: large round nucleus</text></g></g></svg>