<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Double circulation</title><desc id="desc">Pulmonary and systemic blood flow through the four heart chambers.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#273746" stroke-width="3" fill="none"><rect x="345" y="205" width="210" height="150" rx="28"/><path d="M450 205V355M345 280H555"/></g><g font-size="22" font-weight="bold"><text x="390" y="255">RA</text><text x="480" y="255">LA</text><text x="390" y="320">RV</text><text x="480" y="320">LV</text></g><g stroke-width="8" fill="none"><path d="M390 205V110H180V205" stroke="#2563eb"/><path d="M510 205V110H720V205" stroke="#dc2626"/><path d="M390 355V450H180V355" stroke="#2563eb"/><path d="M510 355V450H720V355" stroke="#dc2626"/></g><g font-size="20" text-anchor="middle"><text x="450" y="65">LUNGS</text><text x="450" y="500">BODY TISSUES</text><text x="175" y="170">Pulmonary</text><text x="175" y="195">artery</text><text x="725" y="170">Pulmonary</text><text x="725" y="195">vein</text><text x="175" y="390">Vena cava</text><text x="725" y="390">Aorta</text><text x="450" y="540" font-size="16">Blue: deoxygenated blood   Red: oxygenated blood</text></g></g></svg>