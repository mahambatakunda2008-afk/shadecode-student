<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Mammalian heart structure</title><desc id="desc">Schematic four-chambered heart with septum, major vessels and valves.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><path d="M450 95 C330 20 180 110 250 270 C300 390 450 470 450 470 C450 470 600 390 650 270 C720 110 570 20 450 95Z" fill="#f7c6c6" stroke="#263746" stroke-width="4"/><path d="M450 105V440" stroke="#263746" stroke-width="8"/><path d="M250 180H420V270H250Z" fill="#b8d8ff" stroke="#263746" stroke-width="3"/><path d="M480 180H650V270H480Z" fill="#ffc2c2" stroke="#263746" stroke-width="3"/><path d="M270 290H420V415H270Z" fill="#b8d8ff" stroke="#263746" stroke-width="3"/><path d="M480 290H630V415H480Z" fill="#ffc2c2" stroke="#263746" stroke-width="3"/><g font-size="20" text-anchor="middle"><text x="335" y="230">Right atrium</text><text x="565" y="230">Left atrium</text><text x="335" y="360">Right ventricle</text><text x="565" y="360">Left ventricle</text><text x="450" y="510">Septum separates right and left sides</text></g><g stroke="#263746" stroke-width="3" fill="none"><path d="M300 180V70M600 180V70M330 415V485M570 415V485"/></g><g font-size="17"><text x="205" y="55">Vena cava</text><text x="610" y="55">Pulmonary veins</text><text x="210" y="535">Pulmonary artery</text><text x="610" y="535">Aorta</text></g></g></svg>