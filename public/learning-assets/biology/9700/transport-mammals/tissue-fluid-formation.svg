<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Tissue fluid formation</title><desc id="desc">Capillary filtration at arterial end, osmotic return at venous end and lymph drainage.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><path d="M100 200H800" stroke="#b91c1c" stroke-width="28" stroke-linecap="round"/><g fill="#fff" font-size="19" text-anchor="middle"><text x="220" y="207">Blood</text><text x="680" y="207">Blood</text></g><path d="M250 235V340M360 235V340M470 235V340" stroke="#2563eb" stroke-width="6"/><path d="M650 340V235M730 340V235" stroke="#16a34a" stroke-width="6"/><path d="M500 370H770" stroke="#7c3aed" stroke-width="8"/><g font-size="20"><text x="120" y="120">Arterial end</text><text x="620" y="120">Venous end</text><text x="180" y="395">Filtration: high hydrostatic pressure</text><text x="540" y="430">Osmotic return: plasma proteins remain</text><text x="500" y="480">Excess tissue fluid enters lymphatic vessels</text></g></g></svg>