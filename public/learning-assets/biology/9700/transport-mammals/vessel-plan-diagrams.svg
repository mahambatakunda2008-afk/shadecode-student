<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Artery and vein plan diagrams</title><desc id="desc">Schematic transverse and longitudinal sections of an artery and vein showing wall layers, lumen, and valves in a vein.</desc><rect width="1000" height="600" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b" stroke="#263746" stroke-width="3"><text x="240" y="55" font-size="26" text-anchor="middle" stroke="none">Transverse sections</text><text x="750" y="55" font-size="26" text-anchor="middle" stroke="none">Longitudinal sections</text><circle cx="220" cy="230" r="110" fill="#f3b5b5"/><circle cx="220" cy="230" r="55" fill="#fff"/><circle cx="470" cy="230" r="110" fill="#f3b5b5"/><circle cx="470" cy="230" r="82" fill="#fff"/><rect x="640" y="130" width="150" height="220" rx="18" fill="#f3b5b5"/><rect x="675" y="130" width="80" height="220" fill="#fff"/><rect x="840" y="130" width="120" height="220" rx="18" fill="#f3b5b5"/><rect x="865" y="130" width="70" height="220" fill="#fff"/><path d="M865 220L900 255L935 220" fill="#fff"/><g stroke="none" font-size="20" text-anchor="middle"><text x="220" y="390">Artery</text><text x="470" y="390">Vein</text><text x="715" y="390">Artery</text><text x="900" y="390">Vein with valve</text><text x="500" y="485" font-size="17">Schematic plan diagrams: draw tissue outlines clearly and label visible layers</text><text x="500" y="525" font-size="17">Wall thickness and lumen size are comparative, not to scale</text></g></g></svg>