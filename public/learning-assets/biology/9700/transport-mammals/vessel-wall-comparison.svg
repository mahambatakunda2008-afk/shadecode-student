<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Blood vessel wall comparison</title><desc id="desc">Cross-sections compare elastic artery, muscular artery, vein and capillary.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g stroke="#263746" stroke-width="3" fill="#f5b4b4"><circle cx="125" cy="235" r="88"/><circle cx="125" cy="235" r="42" fill="white"/><circle cx="345" cy="235" r="78"/><circle cx="345" cy="235" r="48" fill="white"/><circle cx="565" cy="235" r="78"/><circle cx="565" cy="235" r="63" fill="white"/><circle cx="785" cy="235" r="28"/><circle cx="785" cy="235" r="22" fill="white"/></g><g font-size="20" text-anchor="middle"><text x="125" y="365">Elastic artery</text><text x="345" y="365">Muscular artery</text><text x="565" y="365">Vein</text><text x="785" y="365">Capillary</text><text x="450" y="445" font-size="17">Schematic only: relative wall and lumen features, not to scale</text></g></g></svg>