<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Cardiac cycle</title><desc id="desc">Timeline schematic showing phases and valve states during one cardiac cycle.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><g font-size="22" text-anchor="middle"><text x="450" y="75">One cardiac cycle</text><rect x="70" y="130" width="240" height="240" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><rect x="330" y="130" width="300" height="240" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/><rect x="650" y="130" width="180" height="240" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="190" y="190">Atrial</text><text x="190" y="220">systole</text><text x="480" y="190">Ventricular</text><text x="480" y="220">systole</text><text x="740" y="190">Diastole</text><text x="190" y="285" font-size="17">AV open</text><text x="190" y="315" font-size="17">SL closed</text><text x="480" y="285" font-size="17">AV closes,</text><text x="480" y="315" font-size="17">SL opens</text><text x="740" y="285" font-size="17">SL closes,</text><text x="740" y="315" font-size="17">AV opens</text><text x="450" y="440" font-size="18">Valve movement follows pressure differences</text></g></g></svg>