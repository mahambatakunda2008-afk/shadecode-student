<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Oxygen dissociation curve</title><desc id="desc">Sigmoid adult haemoglobin oxygen dissociation curve with plateau and steep section.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><path d="M110 440V70M110 440H810" stroke="#111827" stroke-width="3"/><path d="M112 430 C190 425 225 405 270 335 S355 170 450 120 S650 95 790 92" stroke="#2563eb" stroke-width="6" fill="none"/><g font-size="19"><text x="300" y="510">Partial pressure of oxygen (pO₂)</text><text transform="translate(35 350) rotate(-90)">Percentage saturation of haemoglobin</text><text x="570" y="75">Plateau: lungs</text><text x="215" y="300">Steep region: tissues</text><text x="90" y="460" font-size="15">0</text><text x="75" y="95" font-size="15">100</text></g></g></svg>