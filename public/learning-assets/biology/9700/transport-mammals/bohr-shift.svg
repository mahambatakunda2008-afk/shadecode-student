<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Bohr shift</title><desc id="desc">Higher carbon dioxide concentration shifts oxygen dissociation curve to the right.</desc><rect width="900" height="560" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><path d="M110 440V70M110 440H810" stroke="#111827" stroke-width="3"/><path d="M112 430 C185 420 235 380 285 280 S390 115 790 95" stroke="#2563eb" stroke-width="6" fill="none"/><path d="M112 430 C255 428 300 400 355 320 S470 155 790 125" stroke="#dc2626" stroke-width="6" fill="none"/><g font-size="20"><text x="280" y="510">Partial pressure of oxygen</text><text transform="translate(35 350) rotate(-90)">Percentage saturation</text><text x="565" y="70" fill="#2563eb">Lower CO₂ / higher pH</text><text x="565" y="155" fill="#dc2626">Higher CO₂ / lower pH</text><text x="565" y="190">Right shift: lower O₂ affinity</text></g></g></svg>