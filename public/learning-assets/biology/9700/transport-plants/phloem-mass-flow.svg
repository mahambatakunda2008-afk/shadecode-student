<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Phloem loading and mass flow</title><desc id="desc">Source and sink diagram showing proton pump, H+ cotransporter, sucrose loading, water entry and pressure-driven phloem flow.</desc><rect x="0" y="0" width="800" height="520" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}.label{font-size:16px}.head{font-size:23px;font-weight:bold}.line{stroke:#17212b;stroke-width:3;fill:none}.tissue{stroke:#17212b;stroke-width:2}</style><text x="400" y="38" text-anchor="middle" class="head">Phloem loading and mass flow</text><rect x="70" y="100" width="250" height="300" rx="18" fill="#e4efcf" stroke="#17212b" stroke-width="3"/><rect x="480" y="100" width="250" height="300" rx="18" fill="#f3dfbd" stroke="#17212b" stroke-width="3"/><rect x="340" y="140" width="120" height="230" rx="18" fill="#f6d7a8" stroke="#17212b" stroke-width="3"/><text x="195" y="135" text-anchor="middle" class="head">Source</text><text x="605" y="135" text-anchor="middle" class="head">Sink</text><text x="400" y="125" text-anchor="middle" class="label">Phloem</text><path d="M195 190 H350" stroke="#a56a2b" stroke-width="8"/><path d="M350 190 L335 180 M350 190 L335 200" stroke="#a56a2b" stroke-width="5"/><path d="M450 190 H600" stroke="#a56a2b" stroke-width="8"/><path d="M600 190 L585 180 M600 190 L585 200" stroke="#a56a2b" stroke-width="5"/><path d="M400 320 V205" stroke="#287aa6" stroke-width="7"/><path d="M388 220 L400 200 L412 220" stroke="#287aa6" stroke-width="5" fill="none"/><text x="195" y="230" text-anchor="middle" class="label">Sucrose loaded</text><text x="195" y="255" text-anchor="middle" class="label">H+ pump uses ATP</text><text x="195" y="280" text-anchor="middle" class="label">H+ cotransporter</text><text x="605" y="230" text-anchor="middle" class="label">Sucrose unloaded</text><text x="605" y="255" text-anchor="middle" class="label">for use / storage</text><text x="400" y="400" text-anchor="middle" class="label">Pressure gradient: source → sink</text><text x="195" y="345" text-anchor="middle" class="label">Water enters by osmosis</text><text x="605" y="345" text-anchor="middle" class="label">Water leaves</text></svg>