<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Apoplast and symplast pathways</title><desc id="desc">Root tissue diagram showing water moving in cell walls or through cytoplasm and plasmodesmata, with Casparian strip at endodermis.</desc><rect x="0" y="0" width="800" height="520" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}.label{font-size:16px}.head{font-size:23px;font-weight:bold}.line{stroke:#17212b;stroke-width:3;fill:none}.tissue{stroke:#17212b;stroke-width:2}</style><text x="400" y="38" text-anchor="middle" class="head">Water pathways across a root</text><rect x="80" y="100" width="270" height="300" fill="#f3e0bd" stroke="#17212b" stroke-width="3"/><rect x="350" y="100" width="200" height="300" fill="#e4c99d" stroke="#17212b" stroke-width="3"/><rect x="550" y="100" width="170" height="300" fill="#d5e7f2" stroke="#17212b" stroke-width="3"/><g fill="#fff8ea" stroke="#17212b" stroke-width="2"><rect x="100" y="130" width="52" height="230" rx="8"/><rect x="160" y="130" width="52" height="230" rx="8"/><rect x="220" y="130" width="52" height="230" rx="8"/><rect x="280" y="130" width="52" height="230" rx="8"/></g><path d="M95 115 L325 115 L325 385 L95 385 Z" fill="none" stroke="#d17b35" stroke-width="8" stroke-dasharray="12 8"/><path d="M125 245 H315 L390 245 H525 L610 245" stroke="#d17b35" stroke-width="7" fill="none"/><path d="M125 300 H310 L385 300 H525 L610 300" stroke="#287aa6" stroke-width="7" fill="none"/><path d="M335 100 V400" stroke="#a34d3e" stroke-width="12"/><text x="205" y="430" text-anchor="middle" class="label">Cortex</text><text x="450" y="430" text-anchor="middle" class="label">Endodermis</text><text x="635" y="430" text-anchor="middle" class="label">Xylem</text><text x="205" y="175" text-anchor="middle" class="label">Apoplast</text><text x="205" y="195" text-anchor="middle" class="label">cell walls</text><text x="450" y="175" text-anchor="middle" class="label">Casparian</text><text x="450" y="195" text-anchor="middle" class="label">strip</text><text x="205" y="340" text-anchor="middle" class="label">Symplast</text><text x="205" y="360" text-anchor="middle" class="label">cytoplasm</text></svg>