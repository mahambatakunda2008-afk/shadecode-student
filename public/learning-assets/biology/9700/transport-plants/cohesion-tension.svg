<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Cohesion tension mechanism</title><desc id="desc">Leaf evaporation generates tension that pulls a cohesive water column up xylem; water adheres to cellulose vessel walls.</desc><rect x="0" y="0" width="800" height="520" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}.label{font-size:16px}.head{font-size:23px;font-weight:bold}.line{stroke:#17212b;stroke-width:3;fill:none}.tissue{stroke:#17212b;stroke-width:2}</style><text x="400" y="38" text-anchor="middle" class="head">Cohesion-tension in xylem</text><rect x="300" y="110" width="110" height="320" rx="18" fill="#e7c58f" stroke="#17212b" stroke-width="4"/><rect x="330" y="125" width="50" height="290" fill="#b9dced" stroke="#17212b" stroke-width="2"/><path d="M355 380 V155" stroke="#287aa6" stroke-width="8" fill="none"/><path d="M342 175 L355 150 L368 175" fill="none" stroke="#287aa6" stroke-width="6"/><g fill="#c8e2ae" stroke="#17212b" stroke-width="2"><ellipse cx="220" cy="100" rx="85" ry="38"/><ellipse cx="490" cy="100" rx="85" ry="38"/></g><path d="M220 140 L270 180 M490 140 L440 180" stroke="#287aa6" stroke-width="4" stroke-dasharray="8 6"/><text x="220" y="95" text-anchor="middle" class="label">Leaf</text><text x="490" y="95" text-anchor="middle" class="label">Evaporation</text><text x="220" y="200" text-anchor="middle" class="label">Water vapour</text><text x="220" y="222" text-anchor="middle" class="label">diffuses out</text><text x="470" y="260" class="label">Tension pulls</text><text x="470" y="282" class="label">water upwards</text><text x="355" y="465" text-anchor="middle" class="label">Continuous water column</text><text x="70" y="340" class="label">Cohesion:</text><text x="70" y="362" class="label">H-bonds between</text><text x="70" y="384" class="label">water molecules</text><text x="500" y="370" class="label">Adhesion to</text><text x="500" y="392" class="label">cellulose wall</text></svg>