<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Xerophyte leaf transverse section</title><desc id="desc">Schematic xerophyte leaf showing thick cuticle and sunken stomata with hairs trapping humid air.</desc><rect x="0" y="0" width="800" height="520" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}.label{font-size:16px}.head{font-size:23px;font-weight:bold}.line{stroke:#17212b;stroke-width:3;fill:none}.tissue{stroke:#17212b;stroke-width:2}</style><text x="400" y="38" text-anchor="middle" class="head">Xerophyte leaf: transverse section</text><path d="M100 170 Q400 70 700 170 L700 350 Q400 450 100 350 Z" fill="#d7e8bd" stroke="#17212b" stroke-width="3"/><path d="M100 170 Q400 70 700 170" stroke="#9b7c3c" stroke-width="15" fill="none"/><path d="M100 350 Q400 450 700 350" stroke="#9b7c3c" stroke-width="8" fill="none"/><path d="M300 190 Q400 245 500 190 L500 245 Q400 300 300 245 Z" fill="#ffffff" stroke="#17212b" stroke-width="3"/><g stroke="#17212b" stroke-width="3"><path d="M330 205 L315 160 M360 220 L350 170 M390 230 L390 180 M420 230 L430 180 M450 220 L465 170"/></g><ellipse cx="400" cy="270" rx="25" ry="10" fill="#ffffff" stroke="#17212b" stroke-width="3"/><text x="110" y="100" class="label">Thick waxy cuticle</text><path d="M230 110 L280 145" class="line"/><text x="540" y="115" class="label">Hairs</text><path d="M555 125 L470 190" class="line"/><text x="510" y="300" class="label">Sunken stoma</text><path d="M505 292 L425 275" class="line"/><text x="120" y="420" class="label">Trapped humid air reduces water vapour gradient</text></svg>