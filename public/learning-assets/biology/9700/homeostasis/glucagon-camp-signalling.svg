<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Glucagon cell-signalling cascade</title><desc id="desc">Glucagon receptor activates G-protein, adenylyl cyclase, cAMP and protein kinase A; enzyme cascade promotes glycogen breakdown.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Glucagon cell-signalling cascade</text>
<rect x="55" y="155" width="150" height="80" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="130" y="202" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Glucagon</text><rect x="250" y="155" width="160" height="80" rx="14" fill="#e8def8" stroke="#276678" stroke-width="3"/><text x="330" y="202" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Receptor</text><rect x="455" y="155" width="145" height="80" rx="14" fill="#d9eafa" stroke="#276678" stroke-width="3"/><text x="527.5" y="202" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">G-protein</text><rect x="650" y="155" width="190" height="80" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="745" y="202" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Adenylyl cyclase</text><path d="M205 195 L250 195" stroke="#236b87" stroke-width="4" fill="none"/><path d="M410 195 L455 195" stroke="#236b87" stroke-width="4" fill="none"/><path d="M600 195 L650 195" stroke="#236b87" stroke-width="4" fill="none"/><rect x="275" y="315" width="160" height="75" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="355" y="359.5" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">cAMP</text><rect x="500" y="315" width="190" height="75" rx="14" fill="#e8def8" stroke="#276678" stroke-width="3"/><text x="595" y="359.5" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Protein kinase A</text><path d="M745 235 L360 315" stroke="#236b87" stroke-width="4" fill="none"/><path d="M435 352 L500 352" stroke="#236b87" stroke-width="4" fill="none"/><text x="120" y="440" font-family="Arial" font-size="18">Enzyme cascade → glycogen breakdown → glucose release</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>