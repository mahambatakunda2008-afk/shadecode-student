<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">ADH control of water balance</title><desc id="desc">Hypothalamic osmoreceptors signal posterior pituitary ADH release; ADH increases aquaporins in collecting ducts.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">ADH control of water balance</text>
<rect x="65" y="140" width="210" height="90" rx="14" fill="#e8def8" stroke="#276678" stroke-width="3"/><text x="170" y="192" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Hypothalamus</text><rect x="350" y="140" width="210" height="90" rx="14" fill="#f4dada" stroke="#276678" stroke-width="3"/><text x="455" y="192" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Posterior pituitary</text><rect x="640" y="140" width="190" height="90" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="735" y="192" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">ADH in blood</text><path d="M275 185 L350 185" stroke="#236b87" stroke-width="4" fill="none"/><path d="M560 185 L640 185" stroke="#236b87" stroke-width="4" fill="none"/><rect x="350" y="310" width="210" height="90" rx="14" fill="#dceef8" stroke="#276678" stroke-width="3"/><text x="455" y="362" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Collecting duct</text><path d="M735 230 L520 310" stroke="#236b87" stroke-width="4" fill="none"/><text x="90" y="280" font-family="Arial" font-size="18">Low blood water potential</text><text x="350" y="440" font-family="Arial" font-size="18">Aquaporins inserted → water reabsorbed → concentrated urine</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>