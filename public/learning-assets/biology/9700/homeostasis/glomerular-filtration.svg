<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Ultrafiltration at the glomerulus</title><desc id="desc">High pressure forces water and small solutes across capillary endothelium, basement membrane and podocyte filtration slits into Bowman space.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Ultrafiltration at the glomerulus</text>
<rect x="70" y="145" width="220" height="180" rx="14" fill="#f4dada" stroke="#276678" stroke-width="3"/><text x="180" y="242" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Glomerular capillary</text><rect x="360" y="145" width="190" height="180" rx="14" fill="#e7eaf2" stroke="#276678" stroke-width="3"/><text x="455" y="242" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Filtration barrier</text><rect x="620" y="145" width="210" height="180" rx="14" fill="#dceef8" stroke="#276678" stroke-width="3"/><text x="725" y="242" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Bowman's space</text><path d="M290 235 L360 235" stroke="#236b87" stroke-width="4" fill="none"/><path d="M550 235 L620 235" stroke="#236b87" stroke-width="4" fill="none"/><text x="80" y="365" font-family="Arial" font-size="18">Blood cells + large proteins retained</text><text x="365" y="390" font-family="Arial" font-size="18">Endothelium • basement membrane • slit pores</text><text x="625" y="365" font-family="Arial" font-size="18">Water + small solutes</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>