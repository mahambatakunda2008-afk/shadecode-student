<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Blood glucose negative feedback</title><desc id="desc">Insulin lowers elevated blood glucose; glucagon raises low blood glucose through opposing effects.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Blood glucose negative feedback</text>
<rect x="340" y="190" width="220" height="100" rx="14" fill="#d9eafa" stroke="#276678" stroke-width="3"/><text x="450" y="247" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Blood glucose</text><rect x="65" y="105" width="210" height="85" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="170" y="154.5" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">High glucose</text><rect x="625" y="105" width="210" height="85" rx="14" fill="#f4dada" stroke="#276678" stroke-width="3"/><text x="730" y="154.5" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Low glucose</text><path d="M275 145 L340 210" stroke="#236b87" stroke-width="4" fill="none"/><path d="M625 145 L560 210" stroke="#236b87" stroke-width="4" fill="none"/><rect x="55" y="330" width="245" height="90" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="177.5" y="382" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Insulin: uptake + glycogen</text><rect x="600" y="330" width="245" height="90" rx="14" fill="#f4e0e0" stroke="#276678" stroke-width="3"/><text x="722.5" y="382" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Glucagon: glycogen breakdown</text><path d="M410 290 L200 330" stroke="#236b87" stroke-width="4" fill="none"/><path d="M490 290 L700 330" stroke="#236b87" stroke-width="4" fill="none"/><text x="340" y="450" font-family="Arial" font-size="18">Responses oppose the original change</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>