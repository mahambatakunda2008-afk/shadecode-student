<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Guard cells: opening and closing</title><desc id="desc">Solute accumulation causes water entry and increased turgor to open a stoma; solute loss causes water exit and closure.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Guard cells: opening and closing</text>
<rect x="55" y="125" width="350" height="300" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="230" y="282" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">OPENING</text><rect x="495" y="125" width="350" height="300" rx="14" fill="#f4e0e0" stroke="#276678" stroke-width="3"/><text x="670" y="282" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">CLOSING</text><rect x="110" y="200" width="100" height="120" rx="14" fill="#dff4f2" stroke="#276678" stroke-width="3"/><text x="160" y="267" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Guard cell A</text><rect x="250" y="200" width="100" height="120" rx="14" fill="#dff4f2" stroke="#276678" stroke-width="3"/><text x="300" y="267" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Guard cell B</text><rect x="550" y="200" width="100" height="120" rx="14" fill="#dff4f2" stroke="#276678" stroke-width="3"/><text x="600" y="267" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Guard cell A</text><rect x="690" y="200" width="100" height="120" rx="14" fill="#dff4f2" stroke="#276678" stroke-width="3"/><text x="740" y="267" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Guard cell B</text><text x="115" y="370" font-family="Arial" font-size="18">Water enters</text><text x="555" y="370" font-family="Arial" font-size="18">Water leaves</text><text x="115" y="400" font-family="Arial" font-size="18">Turgid; pore opens</text><text x="555" y="400" font-family="Arial" font-size="18">Flaccid; pore closes</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>