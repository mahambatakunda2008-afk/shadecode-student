<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Enzyme colour test strip for glucose</title><desc id="desc">Glucose oxidase generates hydrogen peroxide; peroxidase uses it to oxidise a chromogen and produce a colour.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Enzyme colour test strip for glucose</text>
<rect x="75" y="160" width="190" height="110" rx="14" fill="#dceef8" stroke="#276678" stroke-width="3"/><text x="170" y="222" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Glucose sample</text><rect x="350" y="160" width="190" height="110" rx="14" fill="#fff0cf" stroke="#276678" stroke-width="3"/><text x="445" y="222" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Glucose oxidase</text><rect x="625" y="160" width="190" height="110" rx="14" fill="#f4dada" stroke="#276678" stroke-width="3"/><text x="720" y="222" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">H₂O₂ formed</text><path d="M265 215 L350 215" stroke="#236b87" stroke-width="4" fill="none"/><path d="M540 215 L625 215" stroke="#236b87" stroke-width="4" fill="none"/><rect x="350" y="340" width="190" height="80" rx="14" fill="#e8def8" stroke="#276678" stroke-width="3"/><text x="445" y="387" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Peroxidase</text><rect x="625" y="340" width="190" height="80" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="720" y="387" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Coloured product</text><path d="M720 270 L445 340" stroke="#236b87" stroke-width="4" fill="none"/><path d="M540 380 L625 380" stroke="#236b87" stroke-width="4" fill="none"/><text x="100" y="455" font-family="Arial" font-size="18">Colour intensity compared with calibrated standards</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>