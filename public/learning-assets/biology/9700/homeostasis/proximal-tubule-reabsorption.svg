<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Selective reabsorption in the PCT</title><desc id="desc">Sodium gradient drives sodium-glucose cotransport from filtrate into epithelial cells; glucose enters blood and water follows by osmosis.</desc><rect width="900" height="520" rx="24" fill="#f7fafc"/><text x="38" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123047">Selective reabsorption in the PCT</text>
<rect x="70" y="165" width="210" height="130" rx="14" fill="#dceef8" stroke="#276678" stroke-width="3"/><text x="175" y="237" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Tubule filtrate</text><rect x="350" y="165" width="210" height="130" rx="14" fill="#dff4df" stroke="#276678" stroke-width="3"/><text x="455" y="237" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">PCT epithelial cell</text><rect x="630" y="165" width="200" height="130" rx="14" fill="#f4dada" stroke="#276678" stroke-width="3"/><text x="730" y="237" text-anchor="middle" font-family="Arial" font-size="19" fill="#123047">Blood capillary</text><path d="M280 230 L350 230" stroke="#236b87" stroke-width="4" fill="none"/><path d="M560 230 L630 230" stroke="#236b87" stroke-width="4" fill="none"/><text x="285" y="200" font-family="Arial" font-size="16">Na⁺ + glucose</text><text x="565" y="200" font-family="Arial" font-size="16">Glucose</text><text x="350" y="345" font-family="Arial" font-size="18">Na⁺/K⁺ pump uses ATP at basolateral membrane</text><text x="350" y="385" font-family="Arial" font-size="18">Water follows solute by osmosis</text><text x="38" y="490" font-family="Arial,sans-serif" font-size="14" fill="#526575">Explanatory schematic • not to scale</text></svg>