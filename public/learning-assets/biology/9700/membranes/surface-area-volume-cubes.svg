<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Surface area to volume ratio of cubes</title><desc id="desc">Small and large cubes show how surface area-to-volume ratio decreases as cube side length increases.</desc><rect width="960" height="440" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.t{font-size:20px}.cube{fill:#dceafa;stroke:#245b91;stroke-width:3}</style><text x="480" y="42" text-anchor="middle" class="h">Cube size and surface area-to-volume ratio</text><path class="cube" d="M160 170 L260 120 L360 170 L260 220 Z M160 170 V280 L260 330 V220 M260 220 L360 170 V280 L260 330"/><path class="cube" d="M560 140 L700 70 L840 140 L700 210 Z M560 140 V300 L700 370 V210 M700 210 L840 140 V300 L700 370"/><text x="260" y="385" text-anchor="middle" class="t">Side = 1 cm</text><text x="260" y="414" text-anchor="middle" class="t">SA:V = 6:1</text><text x="700" y="410" text-anchor="middle" class="t">Side = 2 cm, SA:V = 3:1</text></svg>