<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Osmosis effects on plant and animal cells</title><desc id="desc">Plant cells become turgid, flaccid or plasmolysed; animal cells swell, remain normal or shrink depending on surrounding water potential.</desc><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.t{font-size:18px}.plant{fill:#e0f2d5;stroke:#4d8739;stroke-width:7}.pro{fill:#a6c8e9;stroke:#245b91;stroke-width:3}.animal{fill:#f5d9df;stroke:#9b4158;stroke-width:4}</style><text x="500" y="42" text-anchor="middle" class="h">Effects of surrounding water potential</text><text x="250" y="95" text-anchor="middle" class="h">Plant cells</text><text x="750" y="95" text-anchor="middle" class="h">Animal cells</text><rect class="plant" x="75" y="150" width="110" height="110" rx="5"/><rect class="pro" x="88" y="163" width="84" height="84" rx="5"/><text x="130" y="300" text-anchor="middle" class="t">Turgid</text><rect class="plant" x="245" y="150" width="110" height="110" rx="5"/><rect class="pro" x="267" y="172" width="66" height="66" rx="5"/><text x="300" y="300" text-anchor="middle" class="t">Flaccid</text><rect class="plant" x="415" y="150" width="110" height="110" rx="5"/><rect class="pro" x="450" y="185" width="40" height="40" rx="5"/><text x="470" y="300" text-anchor="middle" class="t">Plasmolysed</text><circle class="animal" cx="650" cy="205" r="57"/><circle class="animal" cx="800" cy="205" r="45"/><path class="animal" d="M910 160 L950 185 L930 235 L890 250 L875 200 Z"/><text x="650" y="300" text-anchor="middle" class="t">Swollen / may lyse</text><text x="800" y="300" text-anchor="middle" class="t">Normal</text><text x="910" y="300" text-anchor="middle" class="t">Shrunken</text><text x="500" y="390" text-anchor="middle" class="t">Higher external Ψ: water enters  |  Lower external Ψ: water leaves</text><text x="500" y="430" text-anchor="middle" class="t">Plant cell wall resists expansion; animal cells have no cell wall</text></svg>