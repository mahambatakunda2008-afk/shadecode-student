<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Endocytosis and exocytosis</title><desc id="desc">Endocytosis forms a vesicle from an inward fold of the cell surface membrane; exocytosis fuses a vesicle with the membrane to release contents.</desc><rect width="960" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.t{font-size:19px}.m{stroke:#28799c;stroke-width:10;fill:none;stroke-linecap:round}.v{fill:#dceafa;stroke:#245b91;stroke-width:3}.d{fill:#f3b64d;stroke:#9c5a0b;stroke-width:2}.a{stroke:#172033;stroke-width:3;fill:none}</style><text x="240" y="42" text-anchor="middle" class="h">Endocytosis</text><text x="720" y="42" text-anchor="middle" class="h">Exocytosis</text><path class="m" d="M50 150 H430 M50 260 H430"/><path class="m" d="M160 150 Q160 220 240 220 Q320 220 320 150"/><circle class="d" cx="240" cy="105" r="20"/><path class="a" d="M240 130 L240 180 L225 165 M240 180 L255 165"/><circle class="v" cx="240" cy="300" r="42"/><circle class="d" cx="240" cy="300" r="14"/><text x="240" y="380" text-anchor="middle" class="t">Vesicle formed inside</text><path class="m" d="M530 150 H910 M530 260 H910"/><circle class="v" cx="720" cy="210" r="45"/><circle class="d" cx="720" cy="210" r="14"/><path class="a" d="M720 155 L720 95 L705 110 M720 95 L735 110"/><path class="m" d="M675 150 Q720 100 765 150"/><text x="720" y="330" text-anchor="middle" class="t">Vesicle fuses; contents released</text><text x="480" y="410" text-anchor="middle" class="t">Both are energy-requiring bulk transport processes</text></svg>