<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Membrane transport mechanisms</title><desc id="desc">Summary showing simple diffusion, facilitated diffusion, active transport and vesicle transport across a membrane.</desc><rect width="1000" height="600" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.t{font-size:18px}.mem{fill:#d8eef7;stroke:#27789b;stroke-width:2}.p{fill:#b6a3e8;stroke:#59408d;stroke-width:3}.arr{stroke:#172033;stroke-width:4;fill:none}.dot{fill:#f3b64d;stroke:#9c5a0b;stroke-width:2}</style><text x="500" y="42" text-anchor="middle" class="h">Transport across the cell surface membrane</text><rect class="mem" x="60" y="260" width="880" height="85" rx="20"/><text x="80" y="225" class="t">Higher concentration / outside</text><text x="80" y="390" class="t">Lower concentration / inside</text><g><circle class="dot" cx="140" cy="160" r="10"/><circle class="dot" cx="190" cy="160" r="10"/><circle class="dot" cx="240" cy="160" r="10"/><circle class="dot" cx="290" cy="160" r="10"/><circle class="dot" cx="340" cy="160" r="10"/><circle class="dot" cx="390" cy="160" r="10"/><circle class="dot" cx="440" cy="160" r="10"/><circle class="dot" cx="490" cy="160" r="10"/><circle class="dot" cx="540" cy="160" r="10"/><circle class="dot" cx="590" cy="160" r="10"/><circle class="dot" cx="640" cy="160" r="10"/><circle class="dot" cx="690" cy="160" r="10"/><circle class="dot" cx="740" cy="160" r="10"/><circle class="dot" cx="790" cy="160" r="10"/><circle class="dot" cx="840" cy="160" r="10"/></g><path class="arr" d="M190 185 L190 410 M178 395 L190 410 L202 395"/><text x="190" y="455" text-anchor="middle" class="t">Simple diffusion</text><rect class="p" x="365" y="235" width="65" height="135" rx="25"/><path class="arr" d="M397 185 L397 420 M385 405 L397 420 L409 405"/><text x="397" y="455" text-anchor="middle" class="t">Facilitated</text><text x="397" y="478" text-anchor="middle" class="t">diffusion</text><rect class="p" x="580" y="235" width="65" height="135" rx="25"/><path class="arr" d="M612 420 L612 185 M600 200 L612 185 L624 200"/><text x="612" y="455" text-anchor="middle" class="t">Active transport</text><path class="arr" d="M800 175 Q850 220 850 260 Q850 300 900 300"/><circle class="dot" cx="800" cy="160" r="18"/><text x="840" y="455" text-anchor="middle" class="t">Vesicle transport</text><text x="500" y="550" text-anchor="middle" class="t">Direction and energy requirement distinguish the mechanisms</text></svg>