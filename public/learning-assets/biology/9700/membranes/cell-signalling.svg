<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Cell signalling stages</title><desc id="desc">A signalling cell secretes a ligand, the ligand travels to a target cell, binds a receptor and initiates an intracellular response.</desc><rect width="1000" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.t{font-size:19px}.cell{fill:#d9eafa;stroke:#245b91;stroke-width:4}.lig{fill:#f3b64d;stroke:#9c5a0b;stroke-width:2}.rec{fill:#b6a3e8;stroke:#59408d;stroke-width:3}.arrow{stroke:#172033;stroke-width:3;fill:none}</style><text x="500" y="40" text-anchor="middle" class="h">Cell signalling: secretion → transport → receptor binding</text><circle class="cell" cx="160" cy="220" r="85"/><circle class="lig" cx="160" cy="220" r="12"/><text x="160" y="335" text-anchor="middle" class="t">Signalling cell</text><path class="arrow" d="M255 220 L435 220 M420 205 L435 220 L420 235"/><g><circle class="lig" cx="300" cy="190" r="10"/><circle class="lig" cx="320" cy="245" r="10"/><circle class="lig" cx="340" cy="190" r="10"/><circle class="lig" cx="360" cy="245" r="10"/><circle class="lig" cx="380" cy="190" r="10"/><circle class="lig" cx="400" cy="245" r="10"/></g><text x="345" y="160" text-anchor="middle" class="t">Ligand transported</text><circle class="cell" cx="650" cy="220" r="115"/><path class="rec" d="M545 135 L545 105 Q560 80 575 105 L575 135"/><circle class="lig" cx="560" cy="92" r="10"/><path class="arrow" d="M470 220 L520 220 M505 205 L520 220 L505 235"/><text x="650" y="365" text-anchor="middle" class="t">Target cell</text><path class="arrow" d="M760 220 L900 220 M885 205 L900 220 L885 235"/><text x="875" y="185" text-anchor="middle" class="t">Intracellular</text><text x="875" y="208" text-anchor="middle" class="t">response</text><text x="560" y="65" text-anchor="middle" class="t">Receptor</text></svg>