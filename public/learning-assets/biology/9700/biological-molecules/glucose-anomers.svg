<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Alpha-glucose and beta-glucose</title><desc id="desc">Schematic comparison of the C1 hydroxyl orientation in alpha-D-glucose and beta-D-glucose.</desc><rect x="12" y="12" width="936" height="536" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px}.bond{stroke:#0f172a;stroke-width:4;fill:none;stroke-linecap:round}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none}.head{fill:#bae6fd;stroke:#0369a1;stroke-width:3}.tail{stroke:#475569;stroke-width:10;stroke-linecap:round;fill:none}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style>
<text x="480" y="58" text-anchor="middle" class="h">Glucose anomers: the difference is at carbon 1</text><text x="245" y="115" text-anchor="middle" class="s">α-D-glucose</text><text x="715" y="115" text-anchor="middle" class="s">β-D-glucose</text>
<polygon points="190,225 230,155 315,155 355,225 315,295 230,295" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/><polygon points="660,225 700,155 785,155 825,225 785,295 700,295" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
<text x="272" y="245" text-anchor="middle" class="s">O</text><text x="742" y="245" text-anchor="middle" class="s">O</text><text x="176" y="225" text-anchor="end" class="t">C1</text><text x="646" y="225" text-anchor="end" class="t">C1</text>
<path d="M190 225 L145 225 L145 270 M660 225 L615 225 L615 270" class="bond"/><text x="145" y="300" text-anchor="middle" class="s">OH</text><text x="615" y="300" text-anchor="middle" class="s">OH</text><text x="145" y="330" text-anchor="middle" class="t">below ring</text><text x="615" y="330" text-anchor="middle" class="t">above ring</text>
<rect x="80" y="390" width="800" height="95" rx="16" class="box"/><text x="480" y="430" text-anchor="middle" class="s">Same molecular formula: C₆H₁₂O₆</text><text x="480" y="462" text-anchor="middle" class="t">Different orientation of the hydroxyl group attached to the anomeric carbon (C1)</text><text x="480" y="520" text-anchor="middle" class="small">Schematic teaching aid. Add full atom numbering when practising structural drawings.</text>
