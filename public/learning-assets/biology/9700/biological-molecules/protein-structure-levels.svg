<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Levels of protein structure</title><desc id="desc">Four panels showing primary, secondary, tertiary and quaternary protein structure.</desc><rect x="12" y="12" width="936" height="536" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px}.bond{stroke:#0f172a;stroke-width:4;fill:none;stroke-linecap:round}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none}.head{fill:#bae6fd;stroke:#0369a1;stroke-width:3}.tail{stroke:#475569;stroke-width:10;stroke-linecap:round;fill:none}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style>
<text x="480" y="58" text-anchor="middle" class="h">Four levels of protein structure</text><rect x="55" y="105" width="400" height="170" rx="18" class="box"/><rect x="505" y="105" width="400" height="170" rx="18" class="box"/><rect x="55" y="300" width="400" height="190" rx="18" class="box"/><rect x="505" y="300" width="400" height="190" rx="18" class="box"/>
<text x="255" y="140" text-anchor="middle" class="s">Primary</text><path d="M100 205 L400 205" class="bond"/><g fill="#bae6fd" stroke="#0369a1" stroke-width="2"><circle cx="120" cy="205" r="18"/><circle cx="175" cy="205" r="18"/><circle cx="230" cy="205" r="18"/><circle cx="285" cy="205" r="18"/><circle cx="340" cy="205" r="18"/><circle cx="395" cy="205" r="18"/></g><text x="255" y="250" text-anchor="middle" class="t">Amino-acid sequence</text>
<text x="705" y="140" text-anchor="middle" class="s">Secondary</text><path d="M565 210 C585 150 615 150 635 210 S685 270 705 210 S755 150 775 210 S825 270 845 210" class="bond"/><text x="705" y="250" text-anchor="middle" class="t">α-helix / β-sheet; H-bonds</text>
<text x="255" y="335" text-anchor="middle" class="s">Tertiary</text><path d="M140 420 C80 350 190 350 200 410 S330 480 350 400 S270 360 300 435 S390 450 405 390" class="bond"/><text x="255" y="470" text-anchor="middle" class="t">One chain folded in 3D</text>
<text x="705" y="335" text-anchor="middle" class="s">Quaternary</text><circle cx="635" cy="410" r="48" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><circle cx="745" cy="410" r="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="635" cy="410" r="16" fill="#fbbf24"/><circle cx="745" cy="410" r="16" fill="#fbbf24"/><text x="705" y="470" text-anchor="middle" class="t">Two or more subunits</text>
</svg>