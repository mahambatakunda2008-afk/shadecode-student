<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Amino acid and peptide bond</title><desc id="desc">General amino acid structure and schematic peptide bond formation.</desc><rect x="12" y="12" width="936" height="536" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:14px}.bond{stroke:#0f172a;stroke-width:4;fill:none;stroke-linecap:round}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none}.head{fill:#bae6fd;stroke:#0369a1;stroke-width:3}.tail{stroke:#475569;stroke-width:10;stroke-linecap:round;fill:none}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style>
