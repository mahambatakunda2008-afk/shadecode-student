<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Meiosis overview</title><desc id="desc">A diploid parent cell replicates DNA, undergoes meiosis one separating homologous chromosomes, then meiosis two separating sister chromatids to produce four haploid genetically different cells.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="760" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#0f172a">MEIOSIS: ONE DNA REPLICATION, TWO DIVISIONS</text><g font-family="Arial" fill="#0f172a" text-anchor="middle"><rect x="55" y="115" width="190" height="150" rx="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="150" y="150" font-size="22" font-weight="bold">Diploid cell</text><text x="150" y="184" font-size="19">2n</text><path d="M130 205 Q150 175 170 205 M130 225 Q150 195 170 225" fill="none" stroke="#0369a1" stroke-width="7"/><text x="150" y="250" font-size="14">Homologous pair</text><path d="M250 190 H315" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="325" y="115" width="190" height="150" rx="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="420" y="150" font-size="22" font-weight="bold">DNA replicated</text><text x="420" y="184" font-size="19">2n; chromosomes</text><text x="420" y="210" font-size="19">have two chromatids</text><path d="M395 225 l25 -30 25 30 M445 225 l25 -30 25 30" fill="none" stroke="#0369a1" stroke-width="7"/><path d="M520 190 H585" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="595" y="105" width="245" height="170" rx="24" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="717" y="140" font-size="22" font-weight="bold">Meiosis I</text><text x="717" y="170" font-size="18">Homologous chromosomes</text><text x="717" y="195" font-size="18">separate</text><text x="717" y="235" font-size="18" font-weight="bold">Reduction division</text><path d="M840 190 H900" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><g><rect x="910" y="100" width="125" height="75" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><rect x="910" y="195" width="125" height="75" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="972" y="145" font-size="20">n</text><text x="972" y="240" font-size="20">n</text><text x="972" y="300" font-size="15">Two cells</text></g><path d="M972 275 V350 H600 V400" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="415" width="340" height="120" rx="24" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="600" y="460" font-size="24" font-weight="bold">Meiosis II</text><text x="600" y="495" font-size="19">Sister chromatids separate</text><path d="M600 535 V590 M600 590 H210 V625 M600 590 H990 V625" fill="none" stroke="#334155" stroke-width="4"/><g fill="#fce7f3" stroke="#be185d" stroke-width="3"><circle cx="210" cy="665" r="48"/><circle cx="470" cy="665" r="48"/><circle cx="730" cy="665" r="48"/><circle cx="990" cy="665" r="48"/></g><g font-family="Arial" font-size="19" text-anchor="middle" fill="#831843"><text x="210" y="672">n</text><text x="470" y="672">n</text><text x="730" y="672">n</text><text x="990" y="672">n</text></g><text x="600" y="740" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f172a">Four haploid products; genetic differences arise through recombination and independent assortment</text></g></svg>