<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Meiosis overview</title><desc id="desc">One diploid cell undergoes two divisions to produce four haploid cells.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="190" width="160" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="120" y="247" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Diploid cell 2n</text><path d="M200 240 L300 240" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="250" y="228" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">DNA replicated</text><rect x="300" y="190" width="160" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="380" y="247" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Meiosis I</text><path d="M460 240 L540 240" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="500" y="228" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">homologues separate</text><rect x="540" y="140" width="140" height="80" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="610" y="187" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Haploid n</text><rect x="540" y="270" width="140" height="80" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="610" y="317" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Haploid n</text><path d="M680 180 L750 120" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="715" y="138" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">Meiosis II</text><path d="M680 310 L750 370" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="715" y="328" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">Meiosis II</text><rect x="750" y="70" width="110" height="65" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="805" y="109.5" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">n</text><rect x="750" y="145" width="110" height="65" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="805" y="184.5" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">n</text><rect x="750" y="300" width="110" height="65" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="805" y="339.5" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">n</text><rect x="750" y="375" width="110" height="65" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="805" y="414.5" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">n</text></svg>