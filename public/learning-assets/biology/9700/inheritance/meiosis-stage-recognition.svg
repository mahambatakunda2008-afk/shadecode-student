<g transform="translate(870 205)"><use href="#cell"/><path d="M-48 -48l-22 -22m22 22l22 22M48 48l22 22m-22 -22l-22 -22" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/><path d="M48 -48l22 -22m-22 22l-22 22M-48 48l-22 22m22 -22l22 -22" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/><text y="145" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">D · Anaphase II</text></g><text x="500" y="405" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Schematic only, not to scale. Blue and orange distinguish homologous chromosome origins.</text></svg>