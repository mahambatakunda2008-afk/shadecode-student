<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Pedigree chart symbols and example</title><desc id="d">Legend for pedigree symbols: square male, circle female, filled symbol affected, horizontal line mating, vertical line offspring. Example family shows an affected father and unaffected mother with two children, one affected daughter and one unaffected son.</desc><rect width="1100" height="620" fill="#fff"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#0f172a">PEDIGREE DIAGRAM: SYMBOLS AND READING</text><g font-family="Arial" fill="#0f172a"><text x="80" y="130" font-size="24" font-weight="bold">Key</text><rect x="90" y="165" width="55" height="55" fill="white" stroke="#0f172a" stroke-width="3"/><text x="165" y="200" font-size="20">Male</text><circle cx="350" cy="192" r="28" fill="white" stroke="#0f172a" stroke-width="3"/><text x="395" y="200" font-size="20">Female</text><rect x="600" y="165" width="55" height="55" fill="#0f172a"/><text x="675" y="200" font-size="20">Affected</text><path d="M90 275 H190" stroke="#0f172a" stroke-width="3"/><text x="210" y="282" font-size="20">Mating line</text><path d="M480 260 V310 M420 310 H540" stroke="#0f172a" stroke-width="3"/><text x="560" y="282" font-size="20">Line to offspring</text><text x="550" y="365" text-anchor="middle" font-size="23" font-weight="bold">Example family</text><rect x="340" y="395" width="65" height="65" fill="#0f172a" stroke="#0f172a" stroke-width="3"/><circle cx="695" cy="427" r="33" fill="white" stroke="#0f172a" stroke-width="3"/><path d="M405 427 H662 M533 427 V500 M400 500 H665 M400 500 V530 M665 500 V530" stroke="#0f172a" stroke-width="3" fill="none"/><circle cx="400" cy="565" r="32" fill="#0f172a" stroke="#0f172a" stroke-width="3"/><rect x="633" y="533" width="64" height="64" fill="white" stroke="#0f172a" stroke-width="3"/><text x="372" y="475" font-size="16">Affected father</text><text x="695" y="475" text-anchor="middle" font-size="16">Unaffected mother</text><text x="400" y="610" text-anchor="middle" font-size="16">Affected</text><text x="665" y="610" text-anchor="middle" font-size="16">Unaffected</text></g></svg>