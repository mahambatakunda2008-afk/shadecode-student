<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">X-linked recessive inheritance</title><desc id="desc">Carrier female XAXa crossed with unaffected male XAY; sons receive Y from father and X from mother.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="100" width="260" height="100" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="190" y="157" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Carrier female XᴬXᵃ</text><rect x="580" y="100" width="260" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="710" y="157" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Unaffected male XᴬY</text><path d="M320 150 L580 150" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="450" y="138" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cross</text><rect x="70" y="300" width="170" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="155" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">XᴬXᴬ</text><rect x="270" y="300" width="170" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="355" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">XᴬXᵃ</text><rect x="470" y="300" width="170" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="555" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">XᴬY</text><rect x="670" y="300" width="170" height="90" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="755" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">XᵃY</text></svg>