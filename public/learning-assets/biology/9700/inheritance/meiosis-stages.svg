<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Meiosis chromosome stages</title><desc id="desc">Schematic sequence showing bivalents, homologous separation and sister chromatid separation.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><text x="225" y="70" font-size="23" text-anchor="middle" font-family="Arial">Metaphase I</text><text x="670" y="70" font-size="23" text-anchor="middle" font-family="Arial">Metaphase II</text><path d="M130 120 V410 M320 120 V410" stroke="#64748b" stroke-width="4"/><path d="M170 190 L230 250 M230 190 L170 250 M220 280 L280 340 M280 280 L220 340" stroke="#2563eb" stroke-width="10"/><path d="M580 170 L640 230 M640 170 L580 230 M700 170 L760 230 M760 170 L700 230" stroke="#0f766e" stroke-width="10"/><text x="225" y="450" font-size="19" text-anchor="middle" font-family="Arial">Homologous pairs align</text><text x="670" y="450" font-size="19" text-anchor="middle" font-family="Arial">Single chromosomes align</text></svg>