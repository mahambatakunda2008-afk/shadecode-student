<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Chi-squared calculation</title><desc id="desc">Observed and expected frequencies are compared using the sum of squared deviations divided by expected frequency.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><text x="450" y="95" font-size="30" text-anchor="middle" font-family="Arial">χ² = Σ (O − E)² / E</text><rect x="150" y="150" width="600" height="220" fill="none" stroke="#334155" stroke-width="3"/><path d="M150 220 H750 M450 150 V370" stroke="#334155" stroke-width="3"/><text x="300" y="195" font-size="22" text-anchor="middle" font-family="Arial">Observed (O)</text><text x="600" y="195" font-size="22" text-anchor="middle" font-family="Arial">Expected (E)</text><text x="300" y="280" font-size="27" text-anchor="middle" font-family="Arial">80, 20</text><text x="600" y="280" font-size="27" text-anchor="middle" font-family="Arial">50, 50</text><text x="450" y="430" font-size="24" text-anchor="middle" font-family="Arial">χ² = 36; df = 1</text></svg>