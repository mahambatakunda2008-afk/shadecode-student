<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d"><title id="t">X-linked recessive inheritance cross</title><desc id="d">Carrier female XH Xh crossed with unaffected male XH Y produces four equally likely outcomes: unaffected non-carrier daughter, carrier daughter, unaffected son, and affected son.</desc><rect width="1000" height="700" fill="#fff"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#0f172a">X-LINKED RECESSIVE CROSS</text><text x="500" y="100" text-anchor="middle" font-family="Arial" font-size="23" fill="#334155">Carrier female XᴴXʰ × unaffected male XᴴY</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="500" y="165" font-size="20">Male gametes</text><text x="390" y="210" font-size="24">Xᴴ</text><text x="610" y="210" font-size="24">Y</text><text x="170" y="340" font-size="20">Female</text><text x="170" y="370" font-size="20">gametes</text><text x="270" y="295" font-size="24">Xᴴ</text><text x="270" y="475" font-size="24">Xʰ</text></g><g stroke="#334155" stroke-width="3"><rect x="330" y="230" width="220" height="170" fill="#dcfce7"/><rect x="550" y="230" width="220" height="170" fill="#dbeafe"/><rect x="330" y="400" width="220" height="170" fill="#dcfce7"/><rect x="550" y="400" width="220" height="170" fill="#fee2e2"/></g><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="440" y="295" font-size="30" font-weight="bold">XᴴXᴴ</text><text x="660" y="295" font-size="30" font-weight="bold">XᴴY</text><text x="440" y="465" font-size="30" font-weight="bold">XᴴXʰ</text><text x="660" y="465" font-size="30" font-weight="bold">XʰY</text><text x="440" y="340" font-size="18">Unaffected daughter</text><text x="660" y="340" font-size="18">Unaffected son</text><text x="440" y="510" font-size="18">Carrier daughter</text><text x="660" y="510" font-size="18">Affected son</text><text x="500" y="625" font-size="21">Each outcome: 1/4 of all offspring</text><text x="500" y="660" font-size="18">Among sons: 1/2 affected. Among daughters: 1/2 carriers.</text></g></svg>