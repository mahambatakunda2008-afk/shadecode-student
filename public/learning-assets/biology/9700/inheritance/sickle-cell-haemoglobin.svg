<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Sickle cell haemoglobin</title><desc id="desc">HbS polymerisation at low oxygen can distort red blood cells into sickle shapes.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><ellipse cx="230" cy="250" rx="105" ry="65" fill="#fca5a5" stroke="#991b1b" stroke-width="5"/><ellipse cx="670" cy="250" rx="125" ry="45" transform="rotate(-35 670 250)" fill="#fca5a5" stroke="#991b1b" stroke-width="5"/><text x="230" y="370" font-size="22" text-anchor="middle" font-family="Arial">Typical red cell</text><text x="670" y="370" font-size="22" text-anchor="middle" font-family="Arial">Sickled red cell</text><text x="450" y="460" font-size="20" text-anchor="middle" font-family="Arial">Schematic shapes; not to scale</text></svg>