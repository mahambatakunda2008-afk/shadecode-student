<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gibberellin and stem elongation</title><desc id="desc">Functional Le allele supports gibberellin synthesis; gibberellin promotes stem elongation.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="50" y="110" width="190" height="100" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="145" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Le allele</text><path d="M240 160 L330 160" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="285" y="148" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">functional enzyme</text><rect x="330" y="110" width="190" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="425" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Gibberellin</text><path d="M520 160 L610 160" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="565" y="148" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">growth response</text><rect x="610" y="110" width="220" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="720" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Stem elongation</text><rect x="50" y="300" width="190" height="90" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="145" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">le le</text><path d="M240 345 L330 345" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="285" y="333" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">non-functional enzyme</text><rect x="330" y="300" width="190" height="90" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="425" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Less GA</text><path d="M520 345 L610 345" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="565" y="333" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">reduced</text><rect x="610" y="300" width="220" height="90" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="720" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Dwarf stem</text></svg>