<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gibberellin and DELLA</title><desc id="desc">Gibberellin signalling promotes DELLA protein breakdown, releasing transcription factors to activate growth genes.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="100" width="180" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="130" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Gibberellin</text><path d="M220 145 L300 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="260" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">signal</text><rect x="300" y="100" width="190" height="90" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="395" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">DELLA breakdown</text><path d="M490 145 L570 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="530" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">releases</text><rect x="570" y="100" width="280" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="710" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Transcription factors</text><path d="M710 190 L710 290" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="710" y="228" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">activate</text><rect x="570" y="290" width="280" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="710" y="342" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Growth gene transcription</text></svg>