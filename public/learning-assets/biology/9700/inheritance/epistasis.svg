<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Epistasis</title><desc id="desc">An allele at one gene locus can mask or modify the expression of a second gene locus.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="80" y="110" width="250" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="205" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Gene A allele</text><path d="M330 160 L430 160" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="380" y="148" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">product affects</text><rect x="430" y="110" width="250" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="555" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Gene B expression</text><path d="M555 210 L555 300" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="555" y="243" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">phenotype</text><rect x="430" y="300" width="250" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="555" y="352" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Observed trait</text></svg>