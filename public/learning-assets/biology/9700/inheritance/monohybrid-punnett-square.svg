<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">Monohybrid cross Punnett square</title><desc id="d">Tt crossed with Tt. Gametes T and t from each parent produce TT, Tt, Tt and tt. The genotype ratio is one to two to one and phenotype ratio is three tall to one short.</desc><rect width="900" height="650" fill="#fff"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#0f172a">MONOHYBRID CROSS: Tt × Tt</text><text x="450" y="100" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">T = tall (dominant)   t = short (recessive)</text><g font-family="Arial" text-anchor="middle"><text x="450" y="155" font-size="22" fill="#0f172a">Gametes from parent 2</text><text x="340" y="205" font-size="24" fill="#0f172a">T</text><text x="560" y="205" font-size="24" fill="#0f172a">t</text><text x="145" y="315" font-size="22" fill="#0f172a">Gametes</text><text x="145" y="345" font-size="22" fill="#0f172a">from parent 1</text><text x="255" y="285" font-size="24" fill="#0f172a">T</text><text x="255" y="455" font-size="24" fill="#0f172a">t</text></g><g stroke="#334155" stroke-width="3"><rect x="290" y="225" width="220" height="150" fill="#dcfce7"/><rect x="510" y="225" width="220" height="150" fill="#dcfce7"/><rect x="290" y="375" width="220" height="150" fill="#dcfce7"/><rect x="510" y="375" width="220" height="150" fill="#fee2e2"/></g><g font-family="Arial" font-size="38" font-weight="bold" text-anchor="middle" fill="#0f172a"><text x="400" y="315">TT</text><text x="620" y="315">Tt</text><text x="400" y="465">Tt</text><text x="620" y="465">tt</text></g><g font-family="Arial" font-size="19" text-anchor="middle" fill="#0f172a"><text x="400" y="350">Tall</text><text x="620" y="350">Tall</text><text x="400" y="500">Tall</text><text x="620" y="500">Short</text></g><text x="450" y="575" text-anchor="middle" font-family="Arial" font-size="22" fill="#0f172a">Genotype ratio: 1 TT : 2 Tt : 1 tt</text><text x="450" y="610" text-anchor="middle" font-family="Arial" font-size="22" fill="#0f172a">Phenotype ratio: 3 tall : 1 short</text></svg>