<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Autosomal linkage</title><desc id="desc">Linked alleles on one chromosome produce more parental gametes; crossing over creates recombinant gametes.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><path d="M120 160 H780 M120 220 H780" stroke="#2563eb" stroke-width="14"/><text x="150" y="135" font-size="22" font-family="Arial">A</text><text x="700" y="135" font-size="22" font-family="Arial">B</text><text x="150" y="270" font-size="22" font-family="Arial">a</text><text x="700" y="270" font-size="22" font-family="Arial">b</text><path d="M420 145 L490 235 M420 235 L490 145" stroke="#dc2626" stroke-width="12"/><text x="450" y="350" font-size="22" text-anchor="middle" font-family="Arial">Crossing over between loci creates recombinant chromatids</text></svg>