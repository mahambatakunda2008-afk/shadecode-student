<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Gibberellin removes DELLA repression</title><desc id="desc">Gibberellin enters the cell and promotes breakdown of DELLA protein repressors. Transcription factors that were inhibited by DELLA can then promote transcription of target genes, leading to gene expression and growth responses.</desc><rect width="1100" height="640" fill="#fff"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#0f172a">GIBBERELLIN ACTIVATES GENE EXPRESSION</text><g font-family="Arial" fill="#0f172a" text-anchor="middle"><rect x="70" y="130" width="210" height="120" rx="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="175" y="180" font-size="25" font-weight="bold">Gibberellin</text><text x="175" y="215" font-size="18">GA signal</text><path d="M280 190 H390" stroke="#334155" stroke-width="4"/><path d="M375 175 L395 190 L375 205" fill="none" stroke="#334155" stroke-width="4"/><rect x="400" y="130" width="260" height="120" rx="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="530" y="175" font-size="23" font-weight="bold">DELLA repressors</text><text x="530" y="210" font-size="18">normally inhibit</text><path d="M660 190 H770" stroke="#334155" stroke-width="4"/><path d="M755 175 L775 190 L755 205" fill="none" stroke="#334155" stroke-width="4"/><rect x="780" y="130" width="250" height="120" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="905" y="175" font-size="22" font-weight="bold">DELLA breakdown</text><text x="905" y="210" font-size="18">repression relieved</text><path d="M905 250 V330" stroke="#334155" stroke-width="4"/><path d="M890 315 L905 335 L920 315" fill="none" stroke="#334155" stroke-width="4"/><rect x="700" y="340" width="330" height="125" rx="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="865" y="385" font-size="23" font-weight="bold">Transcription factors</text><text x="865" y="420" font-size="18">can promote transcription</text><path d="M700 405 H600" stroke="#334155" stroke-width="4"/><path d="M615 390 L595 405 L615 420" fill="none" stroke="#334155" stroke-width="4"/><rect x="270" y="340" width="320" height="125" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="430" y="385" font-size="23" font-weight="bold">Target gene expression</text><text x="430" y="420" font-size="18">transcription increases</text><path d="M430 465 V535" stroke="#334155" stroke-width="4"/><path d="M415 520 L430 540 L445 520" fill="none" stroke="#334155" stroke-width="4"/><text x="430" y="580" font-size="22" font-weight="bold">Growth / developmental response</text><text x="550" y="615" font-size="15" fill="#475569">Syllabus focus: gibberellin promotes DELLA breakdown, releasing transcription-promoting factors.</text></g></svg>