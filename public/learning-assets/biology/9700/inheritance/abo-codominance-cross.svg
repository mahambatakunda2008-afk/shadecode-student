<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">ABO blood group inheritance cross</title><desc id="d">A cross between I A i and I B i parents. Four equally likely offspring genotypes are I A I B, I A i, I B i and ii, corresponding to AB, A, B and O blood groups.</desc><rect width="1000" height="650" fill="#fff"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#0f172a">ABO BLOOD GROUP: CODOMINANCE</text><text x="500" y="105" text-anchor="middle" font-family="Arial" font-size="23" fill="#334155">Iᴬi × Iᴮi</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="560" y="170" font-size="20">Parent 2 gametes</text><text x="440" y="220" font-size="25">Iᴮ</text><text x="660" y="220" font-size="25">i</text><text x="175" y="345" font-size="20">Parent 1</text><text x="175" y="375" font-size="20">gametes</text><text x="320" y="300" font-size="25">Iᴬ</text><text x="320" y="465" font-size="25">i</text></g><g stroke="#334155" stroke-width="3"><rect x="365" y="240" width="190" height="145" fill="#ede9fe"/><rect x="555" y="240" width="190" height="145" fill="#dbeafe"/><rect x="365" y="385" width="190" height="145" fill="#dcfce7"/><rect x="555" y="385" width="190" height="145" fill="#fef3c7"/></g><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="460" y="300" font-size="28" font-weight="bold">IᴬIᴮ</text><text x="650" y="300" font-size="28" font-weight="bold">Iᴬi</text><text x="460" y="445" font-size="28" font-weight="bold">Iᴮi</text><text x="650" y="445" font-size="28" font-weight="bold">ii</text><text x="460" y="345" font-size="20">Group AB</text><text x="650" y="345" font-size="20">Group A</text><text x="460" y="490" font-size="20">Group B</text><text x="650" y="490" font-size="20">Group O</text></g><text x="500" y="585" text-anchor="middle" font-family="Arial" font-size="22" fill="#0f172a">Each blood group has probability 1/4 (25%)</text><text x="500" y="620" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Iᴬ and Iᴮ are codominant; both are dominant to i.</text></svg>