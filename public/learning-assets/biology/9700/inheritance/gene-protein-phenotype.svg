<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Gene to protein to phenotype examples</title><desc id="desc">A flow diagram showing how gene alleles can change a protein and produce a phenotype, with syllabus examples TYR and albinism, HBB and sickle cell, F8 and haemophilia, and HTT and Huntington disease.</desc><rect width="1200" height="700" fill="#f8fafc"/><g font-family="Arial" fill="#0f172a"><text x="600" y="55" text-anchor="middle" font-size="34" font-weight="bold">FROM GENE TO PHENOTYPE</text><rect x="65" y="105" width="240" height="105" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="185" y="150" text-anchor="middle" font-size="24" font-weight="bold">Gene allele</text><text x="185" y="182" text-anchor="middle" font-size="18">DNA base sequence</text><path d="M310 158 H395" stroke="#334155" stroke-width="5"/><path d="M380 143 L400 158 L380 173" fill="none" stroke="#334155" stroke-width="5"/><rect x="405" y="105" width="240" height="105" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="525" y="150" text-anchor="middle" font-size="24" font-weight="bold">Protein product</text><text x="525" y="182" text-anchor="middle" font-size="18">Structure / function</text><path d="M650 158 H735" stroke="#334155" stroke-width="5"/><path d="M720 143 L740 158 L720 173" fill="none" stroke="#334155" stroke-width="5"/><rect x="745" y="105" width="390" height="105" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="940" y="150" text-anchor="middle" font-size="24" font-weight="bold">Phenotype</text><text x="940" y="182" text-anchor="middle" font-size="18">Observable characteristic</text><text x="65" y="270" font-size="22" font-weight="bold">Examples specified in Cambridge Biology 9700</text><rect x="65" y="300" width="510" height="135" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="95" y="340" font-size="22" font-weight="bold">TYR → tyrosinase → albinism</text><text x="95" y="380" font-size="18">Reduced / absent functional tyrosinase can</text><text x="95" y="408" font-size="18">reduce melanin production.</text><rect x="625" y="300" width="510" height="135" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="655" y="340" font-size="22" font-weight="bold">HBB → β-globin → sickle cell</text><text x="655" y="380" font-size="18">A variant β-globin can promote haemoglobin</text><text x="655" y="408" font-size="18">polymerisation when deoxygenated.</text><rect x="65" y="465" width="510" height="135" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="95" y="505" font-size="22" font-weight="bold">F8 → factor VIII → haemophilia A</text><text x="95" y="545" font-size="18">Reduced factor VIII activity impairs the</text><text x="95" y="573" font-size="18">blood-clotting cascade.</text><rect x="625" y="465" width="510" height="135" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="655" y="505" font-size="22" font-weight="bold">HTT → huntingtin → Huntington disease</text><text x="655" y="545" font-size="18">Expanded CAG repeats produce an altered</text><text x="655" y="573" font-size="18">huntingtin protein and progressive effects.</text><text x="600" y="650" text-anchor="middle" font-size="18" fill="#475569">Allele → mRNA / translation → protein → cell function → phenotype</text></g></svg>