<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gene to protein to phenotype</title><desc id="desc">DNA allele sequence influences protein structure or amount and therefore phenotype.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="180" width="200" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="160" y="237" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Gene / allele</text><path d="M260 230 L350 230" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="305" y="218" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">transcription / translation</text><rect x="350" y="180" width="200" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="237" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Protein</text><path d="M550 230 L640 230" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="595" y="218" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">function / activity</text><rect x="640" y="180" width="200" height="100" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="740" y="237" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Phenotype</text></svg>