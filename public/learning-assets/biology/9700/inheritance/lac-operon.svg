<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Lac operon</title><desc id="desc">Repressor binds operator when lactose absent; allolactose changes repressor shape allowing transcription.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><text x="450" y="75" font-size="24" text-anchor="middle" font-family="Arial">Lactose absent: repressor blocks transcription</text><rect x="90" y="115" width="720" height="60" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><rect x="300" y="115" width="120" height="60" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/><text x="200" y="155" font-size="19" text-anchor="middle" font-family="Arial">Promoter</text><text x="360" y="155" font-size="19" text-anchor="middle" font-family="Arial">Operator</text><text x="610" y="155" font-size="19" text-anchor="middle" font-family="Arial">Structural genes</text><path d="M360 115 V60" stroke="#991b1b" stroke-width="12"/><text x="360" y="45" font-size="18" text-anchor="middle" font-family="Arial">Repressor</text><text x="450" y="255" font-size="24" text-anchor="middle" font-family="Arial">Lactose present: inducer binds repressor</text><rect x="90" y="300" width="720" height="60" fill="#dcfce7" stroke="#166534" stroke-width="3"/><text x="200" y="340" font-size="19" text-anchor="middle" font-family="Arial">Promoter</text><text x="360" y="340" font-size="19" text-anchor="middle" font-family="Arial">Operator free</text><text x="610" y="340" font-size="19" text-anchor="middle" font-family="Arial">Structural genes transcribed</text><path d="M100 400 H800" stroke="#0f766e" stroke-width="5"/><text x="450" y="445" font-size="20" text-anchor="middle" font-family="Arial">RNA polymerase → mRNA → enzyme synthesis</text></svg>