<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Lac operon gene regulation</title><desc id="desc">Two states of the bacterial lac operon. Without lactose, the active repressor binds the operator and blocks RNA polymerase. With lactose, allolactose binds the repressor, changing its shape so it cannot bind the operator; RNA polymerase transcribes lac structural genes.</desc><rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#0f172a">THE lac OPERON: INDUCIBLE GENE CONTROL</text><g font-family="Arial" fill="#0f172a"><rect x="45" y="105" width="530" height="510" rx="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="310" y="150" text-anchor="middle" font-size="26" font-weight="bold">No lactose present</text><text x="310" y="185" text-anchor="middle" font-size="18">Repressor active: transcription blocked</text><path d="M100 300 H520" stroke="#334155" stroke-width="8"/><rect x="125" y="270" width="105" height="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="177" y="307" text-anchor="middle" font-size="17">Promoter</text><rect x="235" y="270" width="95" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="282" y="307" text-anchor="middle" font-size="17">Operator</text><rect x="335" y="270" width="160" height="60" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="415" y="307" text-anchor="middle" font-size="17">lacZYA</text><path d="M280 260 V220 Q280 195 310 195 Q340 195 340 220 V260" fill="none" stroke="#7f1d1d" stroke-width="12"/><text x="310" y="390" text-anchor="middle" font-size="19" font-weight="bold">Repressor bound to operator</text><path d="M310 410 V460" stroke="#b91c1c" stroke-width="4"/><path d="M285 445 L335 495 M335 445 L285 495" stroke="#b91c1c" stroke-width="8"/><text x="310" y="540" text-anchor="middle" font-size="18">RNA polymerase cannot</text><text x="310" y="565" text-anchor="middle" font-size="18">transcribe structural genes.</text><rect x="625" y="105" width="530" height="510" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="890" y="150" text-anchor="middle" font-size="26" font-weight="bold">Lactose present</text><text x="890" y="185" text-anchor="middle" font-size="18">Allolactose binds repressor: transcription allowed</text><path d="M680 300 H1100" stroke="#334155" stroke-width="8"/><rect x="705" y="270" width="105" height="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="757" y="307" text-anchor="middle" font-size="17">Promoter</text><rect x="815" y="270" width="95" height="60" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="862" y="307" text-anchor="middle" font-size="17">Operator</text><rect x="915" y="270" width="160" height="60" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="995" y="307" text-anchor="middle" font-size="17">lacZYA</text><circle cx="870" cy="225" r="32" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/><circle cx="900" cy="205" r="13" fill="#f59e0b"/><text x="890" y="390" text-anchor="middle" font-size="19" font-weight="bold">Repressor changed shape</text><text x="890" y="420" text-anchor="middle" font-size="17">and cannot bind operator</text><rect x="710" y="455" width="130" height="55" rx="15" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/><text x="775" y="489" text-anchor="middle" font-size="16">RNA polymerase</text><path d="M840 480 H1060" stroke="#15803d" stroke-width="5"/><path d="M1045 465 L1065 480 L1045 495" fill="none" stroke="#15803d" stroke-width="5"/><text x="890" y="555" text-anchor="middle" font-size="18">lacZ, lacY and lacA are transcribed</text><text x="890" y="580" text-anchor="middle" font-size="16">and their proteins are produced.</text></g></svg>