<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Dihybrid cross with independent assortment</title><desc id="d">A 4 by 4 Punnett square for AaBb crossed with AaBb. Each parent forms AB, Ab, aB and ab gametes. The square produces the classic 9:3:3:1 phenotype ratio when both genes show complete dominance and are unlinked.</desc><rect width="1100" height="760" fill="#fff"/><text x="550" y="48" text-anchor="middle" font-family="Arial" font-size="31" font-weight="bold" fill="#0f172a">DIHYBRID CROSS: AaBb × AaBb</text><text x="550" y="85" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Assume complete dominance at both loci and independent assortment</text><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="630" y="130" font-size="20">Gametes from parent 2</text><text x="420" y="175" font-size="20">AB</text><text x="560" y="175" font-size="20">Ab</text><text x="700" y="175" font-size="20">aB</text><text x="840" y="175" font-size="20">ab</text><text x="170" y="350" font-size="20">Gametes</text><text x="170" y="378" font-size="20">from parent 1</text><text x="315" y="260" font-size="20">AB</text><text x="315" y="365" font-size="20">Ab</text><text x="315" y="470" font-size="20">aB</text><text x="315" y="575" font-size="20">ab</text></g><g stroke="#475569" stroke-width="2"><rect x="350" y="195" width="140" height="105" fill="#dcfce7"/><rect x="490" y="195" width="140" height="105" fill="#dcfce7"/><rect x="630" y="195" width="140" height="105" fill="#dcfce7"/><rect x="770" y="195" width="140" height="105" fill="#dcfce7"/><rect x="350" y="300" width="140" height="105" fill="#dcfce7"/><rect x="490" y="300" width="140" height="105" fill="#dcfce7"/><rect x="630" y="300" width="140" height="105" fill="#fef3c7"/><rect x="770" y="300" width="140" height="105" fill="#fef3c7"/><rect x="350" y="405" width="140" height="105" fill="#dcfce7"/><rect x="490" y="405" width="140" height="105" fill="#fef3c7"/><rect x="630" y="405" width="140" height="105" fill="#dcfce7"/><rect x="770" y="405" width="140" height="105" fill="#fef3c7"/><rect x="350" y="510" width="140" height="105" fill="#fef3c7"/><rect x="490" y="510" width="140" height="105" fill="#fee2e2"/><rect x="630" y="510" width="140" height="105" fill="#fef3c7"/><rect x="770" y="510" width="140" height="105" fill="#fee2e2"/></g><g font-family="Arial" font-size="20" text-anchor="middle" fill="#0f172a"><text x="420" y="255">AABB</text><text x="560" y="255">AABb</text><text x="700" y="255">AaBB</text><text x="840" y="255">AaBb</text><text x="420" y="360">AABb</text><text x="560" y="360">AAbb</text><text x="700" y="360">AaBb</text><text x="840" y="360">Aabb</text><text x="420" y="465">AaBB</text><text x="560" y="465">AaBb</text><text x="700" y="465">aaBB</text><text x="840" y="465">aaBb</text><text x="420" y="570">AaBb</text><text x="560" y="570">Aabb</text><text x="700" y="570">aaBb</text><text x="840" y="570">aabb</text></g><text x="550" y="675" text-anchor="middle" font-family="Arial" font-size="23" fill="#0f172a">Phenotype ratio: 9 A_B_ : 3 A_bb : 3 aaB_ : 1 aabb</text><text x="550" y="715" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Do not use this ratio for linked genes, epistasis or other non-standard dominance relationships.</text></svg>