<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Monohybrid Punnett square</title><desc id="desc">Aa crossed with Aa produces 1 AA, 2 Aa and 1 aa.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><text x="450" y="80" font-size="25" text-anchor="middle" font-family="Arial">Aa × Aa</text><rect x="250" y="130" width="400" height="300" fill="none" stroke="#334155" stroke-width="4"/><path d="M450 130 V430 M250 280 H650" stroke="#334155" stroke-width="4"/><text x="350" y="180" font-size="35" text-anchor="middle" font-family="Arial">AA</text><text x="550" y="180" font-size="35" text-anchor="middle" font-family="Arial">Aa</text><text x="350" y="350" font-size="35" text-anchor="middle" font-family="Arial">Aa</text><text x="550" y="350" font-size="35" text-anchor="middle" font-family="Arial">aa</text><text x="450" y="475" font-size="20" text-anchor="middle" font-family="Arial">Genotype ratio 1 : 2 : 1</text></svg>