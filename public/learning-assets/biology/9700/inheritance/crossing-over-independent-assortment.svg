<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Sources of genetic variation during meiosis</title><desc id="desc">Panel one shows non-sister chromatids of homologous chromosomes crossing over and exchanging corresponding segments. Panel two shows two possible random orientations of homologous chromosome pairs at metaphase one, creating different combinations in gametes.</desc><rect width="1200" height="650" fill="#fff"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#0f172a">TWO SOURCES OF GENETIC VARIATION</text><g font-family="Arial" fill="#0f172a"><rect x="40" y="90" width="540" height="500" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="310" y="135" text-anchor="middle" font-size="25" font-weight="bold">1. Crossing over</text><text x="310" y="170" text-anchor="middle" font-size="17">Non-sister chromatids exchange matching segments</text><path d="M190 220 C250 280 190 350 250 430 M250 220 C190 280 250 350 190 430" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/><path d="M370 220 C430 280 370 350 430 430 M430 220 C370 280 430 350 370 430" fill="none" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/><path d="M207 320 L233 344 M387 320 L413 344" stroke="#fff" stroke-width="5"/><path d="M190 355 C220 380 220 400 250 430 M370 355 C400 380 400 400 430 430" fill="none" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/><text x="310" y="485" text-anchor="middle" font-size="18">Recombinant chromatids carry</text><text x="310" y="512" text-anchor="middle" font-size="18">new allele combinations.</text><text x="310" y="552" text-anchor="middle" font-size="15" fill="#475569">Crossing over occurs in prophase I.</text><rect x="620" y="90" width="540" height="500" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="890" y="135" text-anchor="middle" font-size="25" font-weight="bold">2. Independent assortment</text><text x="890" y="170" text-anchor="middle" font-size="17">Homologous pairs orient randomly at metaphase I</text><g stroke-width="12" stroke-linecap="round"><path d="M730 230 V350 M780 230 V350" stroke="#2563eb"/><path d="M900 230 V350 M950 230 V350" stroke="#dc2626"/><path d="M730 430 V550 M780 430 V550" stroke="#2563eb"/><path d="M900 430 V550 M950 430 V550" stroke="#dc2626"/></g><path d="M700 285 H980 M700 485 H980" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/><path d="M840 210 V370 M840 410 V570" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 6"/><text x="840" y="205" text-anchor="middle" font-size="14">Orientation A</text><text x="840" y="405" text-anchor="middle" font-size="14">Orientation B</text><text x="890" y="575" text-anchor="middle" font-size="14">Different maternal/paternal combinations</text></g></svg>