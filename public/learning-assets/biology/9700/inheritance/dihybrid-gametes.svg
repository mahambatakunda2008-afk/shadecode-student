<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Dihybrid gametes</title><desc id="desc">An AaBb individual can produce AB, Ab, aB and ab gametes when genes assort independently.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><rect x="50" y="200" width="170" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="135" y="252" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">AaBb</text><path d="M220 245 L320 245" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="270" y="233" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">meiosis</text><rect x="320" y="90" width="180" height="70" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="410" y="132" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">AB</text><rect x="560" y="90" width="180" height="70" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="132" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Ab</text><rect x="320" y="320" width="180" height="70" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="410" y="362" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">aB</text><rect x="560" y="320" width="180" height="70" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="362" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">ab</text></svg>