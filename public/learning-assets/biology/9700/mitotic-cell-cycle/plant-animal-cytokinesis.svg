<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
<title id="t">Plant and animal cytokinesis</title><desc id="d">Animal cell membrane forms a cleavage furrow, while plant cell vesicles fuse at the equator to create a cell plate.</desc>
<rect width="1000" height="450" rx="24" fill="#f7fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Cytokinesis in animal and plant cells</text>
<g font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle"><text x="250" y="90">Animal cell</text><text x="750" y="90">Plant cell</text></g>
<ellipse cx="250" cy="235" rx="175" ry="110" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><path d="M250 125 C205 175 205 295 250 345" fill="none" stroke="#dc2626" stroke-width="12"/><path d="M250 125 C295 175 295 295 250 345" fill="none" stroke="#dc2626" stroke-width="12"/>
<rect x="575" y="125" width="350" height="220" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="7"/><path d="M750 135 V335" stroke="#b45309" stroke-width="10"/><g fill="#f59e0b"><circle cx="735" cy="185" r="8"/><circle cx="765" cy="215" r="8"/><circle cx="735" cy="250" r="8"/><circle cx="765" cy="285" r="8"/></g>
<g font-family="Arial" font-size="17" fill="#334155" text-anchor="middle"><text x="250" y="390">Cleavage furrow constricts</text><text x="250" y="412">the cell surface membrane</text><text x="750" y="390">Vesicles fuse to form a cell plate,</text><text x="750" y="412">which develops into new wall and membranes</text></g></svg>