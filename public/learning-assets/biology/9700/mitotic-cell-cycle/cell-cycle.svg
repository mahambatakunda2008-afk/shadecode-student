<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d">
<title id="t">Mitotic cell cycle</title><desc id="d">Circular sequence of G1, S, G2, mitosis and cytokinesis, showing DNA replication during S phase.</desc>
<rect width="1000" height="480" rx="24" fill="#f7fafc"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Mitotic cell cycle</text>
<g font-family="Arial" text-anchor="middle" fill="#fff" font-weight="700"><rect x="390" y="85" width="220" height="70" rx="18" fill="#0e7490"/><text x="500" y="128" font-size="24">G1: growth</text><rect x="690" y="200" width="220" height="70" rx="18" fill="#0e7490"/><text x="800" y="243" font-size="24">S: DNA replication</text><rect x="390" y="330" width="220" height="70" rx="18" fill="#0e7490"/><text x="500" y="373" font-size="24">G2: preparation</text><rect x="90" y="200" width="220" height="70" rx="18" fill="#7c3aed"/><text x="200" y="243" font-size="24">Mitosis</text><rect x="390" y="200" width="220" height="70" rx="18" fill="#b45309"/><text x="500" y="243" font-size="24">Cytokinesis</text></g>
<g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M610 120 Q720 120 780 195"/><path d="M800 270 Q760 340 615 365"/><path d="M390 365 Q250 340 205 275"/><path d="M200 200 Q250 120 390 120"/><path d="M500 155 L500 195"/></g>
<g font-family="Arial" font-size="17" fill="#334155" text-anchor="middle"><text x="500" y="455">Interphase = G1 + S + G2. Mitosis divides the nucleus;</text><text x="500" y="475">cytokinesis divides the cytoplasm.</text></g>
</svg>