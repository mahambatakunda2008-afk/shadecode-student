<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Stages of mitosis</title><desc id="d">Four stages show condensed chromosomes, equatorial alignment, separation to opposite poles and reformation of nuclei.</desc>
<rect width="1200" height="430" rx="24" fill="#f7fafc"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Mitosis: chromosome behaviour</text>
<g font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle"><text x="150" y="85">Prophase</text><text x="450" y="85">Metaphase</text><text x="750" y="85">Anaphase</text><text x="1050" y="85">Telophase</text></g>
<g fill="none" stroke="#64748b" stroke-width="4"><ellipse cx="150" cy="225" rx="105" ry="90"/><ellipse cx="450" cy="225" rx="105" ry="90"/><ellipse cx="750" cy="225" rx="105" ry="90"/><ellipse cx="1050" cy="225" rx="105" ry="90"/></g>
<g stroke="#7c3aed" stroke-width="8" stroke-linecap="round"><path d="M120 180 l25 45 m0 -45 l-25 45 M170 190 l25 45 m0 -45 l-25 45"/><path d="M450 150 v150 M420 180 l30 45 30 -45 M420 240 l30 45 30 -45"/><path d="M700 190 l-35 25 m35 -25 l-35 -25 M800 190 l35 25 m-35 -25 l35 -25 M700 260 l-35 25 m35 -25 l-35 -25 M800 260 l35 25 m-35 -25 l35 -25"/></g>
<g fill="none" stroke="#0e7490" stroke-width="3"><path d="M80 225 L220 225 M380 225 L520 225 M680 225 L820 225"/></g>
<g fill="none" stroke="#0891b2" stroke-width="4"><ellipse cx="1010" cy="225" rx="48" ry="55"/><ellipse cx="1090" cy="225" rx="48" ry="55"/></g>
<g font-family="Arial" font-size="16" fill="#334155" text-anchor="middle"><text x="150" y="350">Chromosomes condense;</text><text x="150" y="372">nuclear envelope breaks down</text><text x="450" y="350">Chromosomes align</text><text x="450" y="372">at the equator</text><text x="750" y="350">Sister chromatids</text><text x="750" y="372">move to opposite poles</text><text x="1050" y="350">Nuclear envelopes reform;</text><text x="1050" y="372">chromosomes decondense</text></g></svg>