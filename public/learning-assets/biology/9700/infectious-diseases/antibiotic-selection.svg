<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Antibiotic resistance by natural selection</title><desc id="desc">A bacterial population contains susceptible and resistant variants. Antibiotic exposure removes susceptible bacteria, leaving resistant variants to reproduce and increase in frequency.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Antibiotic resistance by natural selection</text><rect x="35" y="150" width="185" height="155" rx="16" fill="#e8f2fa" stroke="#27758a" stroke-width="2"/><text x="127.5" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">VARIATION</text><text x="127.5" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Mostly susceptible; rare resistant</text><path d="M230 225 L280 225" stroke="#26758a" stroke-width="3" fill="none"/><path d="M271 218 L280 225 L271 232" stroke="#26758a" stroke-width="3" fill="none"/><rect x="290" y="150" width="185" height="155" rx="16" fill="#fbe9e7" stroke="#27758a" stroke-width="2"/><text x="382.5" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">ANTIBIOTIC</text><text x="382.5" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Susceptible cells removed</text><path d="M485 225 L535 225" stroke="#26758a" stroke-width="3" fill="none"/><path d="M526 218 L535 225 L526 232" stroke="#26758a" stroke-width="3" fill="none"/><rect x="545" y="150" width="185" height="155" rx="16" fill="#fff3d9" stroke="#27758a" stroke-width="2"/><text x="637.5" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">SURVIVORS</text><text x="637.5" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Resistant cells remain</text><path d="M740 225 L780 225" stroke="#26758a" stroke-width="3" fill="none"/><path d="M771 218 L780 225 L771 232" stroke="#26758a" stroke-width="3" fill="none"/><rect x="785" y="150" width="85" height="155" rx="12" fill="#e6f4e8" stroke="#27758a" stroke-width="2"/><text x="827" y="205" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#123">MORE</text><text x="827" y="230" text-anchor="middle" font-family="Arial" font-size="15" fill="#123">RESISTANT</text><text x="827" y="253" text-anchor="middle" font-family="Arial" font-size="15" fill="#123">CELLS</text><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="18" fill="#345">Resistant bacteria reproduce and pass resistance to descendants.</text><text x="450" y="425" text-anchor="middle" font-family="Arial" font-size="15" fill="#567">Antibiotics select variants; they do not create purposeful adaptation.</text></svg>