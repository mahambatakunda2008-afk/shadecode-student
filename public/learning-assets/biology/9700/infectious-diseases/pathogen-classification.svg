<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Four diseases and their pathogens</title><desc id="desc">A classification chart linking cholera, malaria, tuberculosis and HIV/AIDS to the named pathogen and pathogen type.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Four diseases and their pathogens</text><rect x="45" y="105" width="385" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="237.5" y="141" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">CHOLERA</text><text x="237.5" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Vibrio cholerae • bacterium</text><rect x="470" y="105" width="385" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="662.5" y="141" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">MALARIA</text><text x="662.5" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Four Plasmodium species • protoctists</text><rect x="45" y="285" width="385" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="237.5" y="321" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">TUBERCULOSIS (TB)</text><text x="237.5" y="353" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">M. tuberculosis / M. bovis • bacteria</text><rect x="470" y="285" width="385" height="130" rx="16" fill="#f0ebfb" stroke="#27758a" stroke-width="2"/><text x="662.5" y="321" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">HIV / AIDS</text><text x="662.5" y="353" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Human immunodeficiency virus • virus</text><text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="16" fill="#345">Pathogen = causal infectious agent; disease = condition</text></svg>