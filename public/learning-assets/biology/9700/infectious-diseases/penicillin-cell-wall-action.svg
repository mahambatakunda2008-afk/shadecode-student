<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Penicillin and bacterial cell-wall formation</title><desc id="desc">Penicillin inhibits peptidoglycan cross-linking, weakening the bacterial wall so actively growing susceptible bacteria may lyse.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Penicillin and bacterial cell-wall formation</text><rect x="45" y="150" width="230" height="160" rx="16" fill="#e6f4e8" stroke="#27758a" stroke-width="2"/><text x="160" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">NORMAL WALL</text><text x="160" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Peptidoglycan cross-links intact</text><path d="M285 230 L350 230" stroke="#26758a" stroke-width="3" fill="none"/><path d="M341 223 L350 230 L341 237" stroke="#26758a" stroke-width="3" fill="none"/><rect x="360" y="150" width="210" height="160" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="465" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">PENICILLIN</text><text x="465" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Blocks cross-linking</text><path d="M580 230 L645 230" stroke="#26758a" stroke-width="3" fill="none"/><path d="M636 223 L645 230 L636 237" stroke="#26758a" stroke-width="3" fill="none"/><rect x="655" y="150" width="200" height="160" rx="16" fill="#fbe9e7" stroke="#27758a" stroke-width="2"/><text x="755" y="186" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">WEAK WALL</text><text x="755" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Cell may lyse</text><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="18" fill="#345">Viruses have no peptidoglycan cell wall: this target is absent.</text></svg>