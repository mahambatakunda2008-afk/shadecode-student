<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Match control to transmission route</title><desc id="desc">An intervention matrix connecting each disease to its transmission route and example prevention or control measures.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Match control to transmission route</text><rect x="35" y="105" width="830" height="330" rx="12" fill="#fff" stroke="#27758a" stroke-width="2"/><path d="M35 165H865 M35 232H865 M35 299H865 M35 366H865 M230 105V435 M490 105V435" stroke="#9abac5" stroke-width="2"/><g font-family="Arial" fill="#123447"><text x="55" y="145" font-size="18" font-weight="700">Disease</text><text x="250" y="145" font-size="18" font-weight="700">Route</text><text x="510" y="145" font-size="18" font-weight="700">Control examples</text><text x="55" y="205" font-size="17">Cholera</text><text x="250" y="205" font-size="16">Faecal–oral</text><text x="510" y="205" font-size="16">Safe water, sanitation, food hygiene</text><text x="55" y="272" font-size="17">Malaria</text><text x="250" y="272" font-size="16">Mosquito vector</text><text x="510" y="272" font-size="16">Bed nets, vector control, reduce breeding sites</text><text x="55" y="339" font-size="17">TB</text><text x="250" y="339" font-size="16">Airborne</text><text x="510" y="339" font-size="16">Early diagnosis, treatment, ventilation</text><text x="55" y="406" font-size="17">HIV</text><text x="250" y="406" font-size="16">Body fluids</text><text x="510" y="406" font-size="16">Condoms, sterile equipment, testing, treatment</text></g></svg>