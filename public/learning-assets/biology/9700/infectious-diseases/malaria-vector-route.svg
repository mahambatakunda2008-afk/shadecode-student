<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Malaria: host-to-host transmission</title><desc id="desc">A simplified route showing Plasmodium transmission from an infected human to a female Anopheles mosquito and then to another human. It is not a parasite life-cycle diagram.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Malaria: host-to-host transmission</text><rect x="55" y="180" width="210" height="150" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="160" y="216" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">INFECTED HUMAN</text><text x="160" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Plasmodium present</text><path d="M275 255 L340 255" stroke="#26758a" stroke-width="3" fill="none"/><path d="M331 248 L340 255 L331 262" stroke="#26758a" stroke-width="3" fill="none"/><rect x="350" y="180" width="210" height="150" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="455" y="216" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">FEMALE ANOPHELES</text><text x="455" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Takes blood meal</text><path d="M570 255 L635 255" stroke="#26758a" stroke-width="3" fill="none"/><path d="M626 248 L635 255 L626 262" stroke="#26758a" stroke-width="3" fill="none"/><rect x="645" y="180" width="210" height="150" rx="16" fill="#f0ebfb" stroke="#27758a" stroke-width="2"/><text x="750" y="216" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">NEW HUMAN HOST</text><text x="750" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Infective bite</text><text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="18" fill="#345">Mosquito = vector that transfers the pathogen between hosts</text><text x="450" y="445" text-anchor="middle" font-family="Arial" font-size="15" fill="#567">Detailed Plasmodium life-cycle stages are not required here.</text></svg>