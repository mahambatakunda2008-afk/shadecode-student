<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Transmission routes compared</title><desc id="desc">Four pathways: contaminated food or water for cholera, mosquito vector for malaria, inhaled aerosols for TB, and infectious body fluids for HIV.</desc><rect width="900" height="520" fill="#f7fbfd"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123447">Transmission routes compared</text><rect x="35" y="115" width="190" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="130" y="151" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">CHOLERA</text><text x="130" y="183" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Faeces → food/water</text><path d="M230 180 L255 180" stroke="#26758a" stroke-width="3" fill="none"/><path d="M246 173 L255 180 L246 187" stroke="#26758a" stroke-width="3" fill="none"/><rect x="260" y="115" width="170" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="345" y="151" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">INGESTION</text><text x="345" y="183" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Contaminated material</text><rect x="470" y="115" width="190" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="565" y="151" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">MALARIA</text><text x="565" y="183" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Infected female mosquito</text><path d="M665 180 L690 180" stroke="#26758a" stroke-width="3" fill="none"/><path d="M681 173 L690 180 L681 187" stroke="#26758a" stroke-width="3" fill="none"/><rect x="695" y="115" width="170" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="780" y="151" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">VECTOR BITE</text><text x="780" y="183" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Plasmodium transfer</text><rect x="35" y="300" width="190" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="130" y="336" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">TB</text><text x="130" y="368" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Infectious droplets</text><path d="M230 365 L255 365" stroke="#26758a" stroke-width="3" fill="none"/><path d="M246 358 L255 365 L246 372" stroke="#26758a" stroke-width="3" fill="none"/><rect x="260" y="300" width="170" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="345" y="336" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">INHALATION</text><text x="345" y="368" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Airborne particles</text><rect x="470" y="300" width="190" height="130" rx="16" fill="#e5f4f8" stroke="#27758a" stroke-width="2"/><text x="565" y="336" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">HIV</text><text x="565" y="368" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Infectious body fluids</text><path d="M665 365 L690 365" stroke="#26758a" stroke-width="3" fill="none"/><path d="M681 358 L690 365 L681 372" stroke="#26758a" stroke-width="3" fill="none"/><rect x="695" y="300" width="170" height="130" rx="16" fill="#f0ebfb" stroke="#27758a" stroke-width="2"/><text x="780" y="336" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#123447">EXPOSURE</text><text x="780" y="368" text-anchor="middle" font-family="Arial" font-size="15" fill="#234">Entry into body</text></svg>