<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Transcription and translation</title><desc id="desc">DNA is transcribed into pre-mRNA, processed by intron removal and exon joining, then translated at a ribosome using tRNA to build a polypeptide.</desc><rect width="1000" height="600" rx="24" fill="#f8fbff"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#102a43">Gene expression: DNA to polypeptide</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="100" width="840" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="135" font-size="23" font-weight="bold" fill="#1e3a8a">DNA gene</text><text x="500" y="165" font-size="17" fill="#334155">RNA polymerase uses the template strand</text><path d="M500 190 L500 230" stroke="#475569" stroke-width="4"/><path d="M490 220 L500 235 L510 220" fill="none" stroke="#475569" stroke-width="4"/><rect x="80" y="240" width="840" height="80" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="272" font-size="23" font-weight="bold" fill="#166534">Pre-mRNA → mature mRNA</text><text x="500" y="300" font-size="17" fill="#334155">Introns removed; exons joined (eukaryotes)</text><path d="M500 320 L500 360" stroke="#475569" stroke-width="4"/><path d="M490 350 L500 365 L510 350" fill="none" stroke="#475569" stroke-width="4"/><rect x="80" y="370" width="840" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500" y="405" font-size="23" font-weight="bold" fill="#92400e">Ribosome reads mRNA codons</text><text x="500" y="435" font-size="17" fill="#334155">tRNA anticodons pair with codons and deliver amino acids</text><path d="M500 470 L500 510" stroke="#475569" stroke-width="4"/><path d="M490 500 L500 515 L510 500" fill="none" stroke="#475569" stroke-width="4"/><rect x="220" y="520" width="560" height="55" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="500" y="555" font-size="22" font-weight="bold" fill="#5b21b6">Polypeptide chain</text></g></svg>