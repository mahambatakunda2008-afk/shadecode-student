<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Effects of gene mutations</title><desc id="desc">Comparison of a normal sequence with substitution, insertion and deletion, showing possible codon changes and frameshift.</desc><rect width="1000" height="600" rx="24" fill="#f8fbff"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#102a43">Gene mutations and reading frames</text><g font-family="Arial" font-size="20"><text x="70" y="115" font-weight="bold" fill="#334155">Normal</text><text x="280" y="115" fill="#166534">ATG | CCA | TTT | GGC</text><text x="70" y="215" font-weight="bold" fill="#334155">Substitution</text><text x="280" y="215" fill="#b45309">ATG | CTA | TTT | GGC</text><text x="70" y="315" font-weight="bold" fill="#334155">Insertion (+A)</text><text x="280" y="315" fill="#b91c1c">ATG | ACC | ATT | TGG | C…</text><text x="70" y="415" font-weight="bold" fill="#334155">Deletion (−C)</text><text x="280" y="415" fill="#b91c1c">ATG | CAT | TTG | GC…</text></g><g stroke="#cbd5e1" stroke-width="2"><path d="M65 145 H930"/><path d="M65 245 H930"/><path d="M65 345 H930"/><path d="M65 445 H930"/></g><g font-family="Arial" font-size="17" fill="#475569"><text x="280" y="165">Reference reading frame</text><text x="280" y="265">May be silent, missense or nonsense</text><text x="280" y="365">One-base insertion shifts downstream codons</text><text x="280" y="465">One-base deletion shifts downstream codons</text><text x="500" y="535" text-anchor="middle">A change in DNA sequence may alter mRNA codons and the polypeptide.</text><text x="500" y="565" text-anchor="middle">Insertions/deletions not in multiples of three usually cause a frameshift.</text></g></svg>