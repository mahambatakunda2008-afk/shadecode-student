<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">DNA double helix structure</title><desc id="desc">Schematic DNA ladder showing antiparallel strands, complementary base pairs and hydrogen bonds.</desc><rect width="900" height="520" rx="24" fill="#f8fbff"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#102a43">DNA: two antiparallel polynucleotide strands</text><path d="M210 105 C340 145 340 205 210 245 S80 345 210 405 S340 465 210 490" fill="none" stroke="#1677a8" stroke-width="13" stroke-linecap="round"/><path d="M690 105 C560 145 560 205 690 245 S820 345 690 405 S560 465 690 490" fill="none" stroke="#1677a8" stroke-width="13" stroke-linecap="round"/><g stroke="#64748b" stroke-width="5"><path d="M205 130 L695 130"/><path d="M250 190 L650 190"/><path d="M250 270 L650 270"/><path d="M205 350 L695 350"/><path d="M205 430 L695 430"/></g><g font-family="Arial" font-size="25" font-weight="bold" text-anchor="middle"><text x="330" y="120" fill="#b45309">A</text><text x="570" y="120" fill="#047857">T</text><text x="330" y="180" fill="#047857">C</text><text x="570" y="180" fill="#b45309">G</text><text x="330" y="260" fill="#b45309">T</text><text x="570" y="260" fill="#047857">A</text><text x="330" y="340" fill="#047857">G</text><text x="570" y="340" fill="#b45309">C</text><text x="330" y="420" fill="#b45309">A</text><text x="570" y="420" fill="#047857">T</text></g><g stroke="#475569" stroke-width="2" stroke-dasharray="6 5"><path d="M350 125 L550 125"/><path d="M350 185 L550 185"/><path d="M350 265 L550 265"/><path d="M350 345 L550 345"/><path d="M350 425 L550 425"/></g><g font-family="Arial" font-size="17" fill="#334155"><text x="105" y="90">5′</text><text x="105" y="490">3′</text><text x="755" y="90">3′</text><text x="755" y="490">5′</text><text x="450" y="155" text-anchor="middle">2 hydrogen bonds</text><text x="450" y="215" text-anchor="middle">3 hydrogen bonds</text><text x="450" y="300" text-anchor="middle">Complementary base pairs</text><text x="450" y="475" text-anchor="middle">Sugar–phosphate backbones</text></g><text x="450" y="510" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Schematic, not to scale. Phosphodiester bonds link nucleotides within each backbone.</text></svg>