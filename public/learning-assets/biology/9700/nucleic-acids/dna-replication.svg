<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Semi-conservative DNA replication</title><desc id="desc">Parental DNA strands separate and each templates a new complementary strand, producing two DNA molecules with one old and one new strand each.</desc><rect width="1000" height="560" rx="24" fill="#f8fbff"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#102a43">Semi-conservative DNA replication</text><g font-family="Arial" font-size="19" text-anchor="middle"><text x="500" y="92" fill="#334155">Parental DNA</text><text x="250" y="260" fill="#334155">Two templates</text><text x="750" y="260" fill="#334155">Two daughter DNA molecules</text></g><g stroke-width="12" stroke-linecap="round" fill="none"><path d="M390 125 L610 125" stroke="#2563eb"/><path d="M390 165 L610 165" stroke="#2563eb"/><path d="M500 180 L300 220" stroke="#2563eb"/><path d="M500 180 L700 220" stroke="#2563eb"/><path d="M300 220 L300 310" stroke="#2563eb"/><path d="M700 220 L700 310" stroke="#2563eb"/><path d="M300 330 L170 390" stroke="#2563eb"/><path d="M300 330 L430 390" stroke="#16a34a"/><path d="M700 330 L570 390" stroke="#16a34a"/><path d="M700 330 L830 390" stroke="#2563eb"/></g><g stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"><path d="M170 405 L430 405"/><path d="M570 405 L830 405"/></g><g font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle"><text x="500" y="145" fill="#fff">Original strands</text><text x="300" y="365" fill="#334155">Template</text><text x="700" y="365" fill="#334155">Template</text><text x="300" y="455" fill="#166534">One old + one new</text><text x="700" y="455" fill="#166534">One old + one new</text></g><g fill="#2563eb"><rect x="120" y="485" width="24" height="12" rx="6"/><rect x="120" y="510" width="24" height="12" rx="6"/></g><g fill="#16a34a"><rect x="120" y="535" width="24" height="12" rx="6"/></g><g font-family="Arial" font-size="16" fill="#334155"><text x="155" y="497">Parental strand</text><text x="155" y="522">Original DNA</text><text x="155" y="547">Newly synthesised strand</text></g><text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Each parental strand acts as a template for complementary DNA synthesis.</text></svg>