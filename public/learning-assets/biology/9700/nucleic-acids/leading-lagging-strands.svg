<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Leading and lagging strand synthesis</title><desc id="desc">Replication fork with continuous leading strand synthesis and discontinuous lagging strand synthesis as Okazaki fragments joined by DNA ligase.</desc><rect width="1000" height="560" rx="24" fill="#f8fbff"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#102a43">Leading and lagging strand synthesis</text><path d="M170 150 L470 150 L650 300" stroke="#2563eb" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M170 450 L470 450 L650 300" stroke="#2563eb" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M650 300 L850 300" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/><path d="M650 300 L470 150" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/><path d="M470 150 L230 150" stroke="#16a34a" stroke-width="10" fill="none" stroke-linecap="round"/><g stroke="#d97706" stroke-width="10" stroke-linecap="round"><path d="M500 450 L570 392"/><path d="M390 450 L450 400"/><path d="M280 450 L340 400"/></g><g font-family="Arial" font-size="20" fill="#334155"><text x="250" y="105">Leading strand: continuous</text><text x="245" y="505">Lagging strand: Okazaki fragments</text><text x="670" y="270">Replication fork</text><text x="530" y="365">DNA ligase joins fragments</text><text x="230" y="190">5′ → 3′ synthesis</text><text x="230" y="480">5′ → 3′ synthesis in fragments</text></g><path d="M570 392 L620 345" stroke="#334155" stroke-width="2"/><text x="500" y="545" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">DNA polymerase adds nucleotides only to the 3′ end of a growing strand.</text></svg>