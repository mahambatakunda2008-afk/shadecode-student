<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">T-test workflow</title><desc id="desc">Set a null hypothesis, calculate t, compare with critical value and interpret significance.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="50" y="100" width="180" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="140" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Null hypothesis</text><path d="M230 145 L300 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="265" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="300" y="100" width="180" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="390" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Calculate t</text><path d="M480 145 L550 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="515" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="550" y="100" width="290" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="695" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Compare critical value</text><path d="M690 190 L690 280" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="690" y="223" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="550" y="280" width="290" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="695" y="332" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Significant?</text><text x="450" y="440" font-size="21" text-anchor="middle" font-family="Arial">Do not reject null if t does not exceed critical value</text></svg>