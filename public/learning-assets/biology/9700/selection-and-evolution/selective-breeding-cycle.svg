<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Selective breeding cycle</title><desc id="desc">Select parents, breed, assess offspring and repeat selection over generations.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="50" y="100" width="180" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="140" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Select parents</text><path d="M230 145 L310 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="270" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="310" y="100" width="180" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="400" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Breed</text><path d="M490 145 L570 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="530" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="570" y="100" width="260" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="700" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Assess offspring</text><path d="M700 190 L700 280" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="700" y="223" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">select best</text><rect x="570" y="280" width="260" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="700" y="332" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Repeat generations</text><path d="M570 325 L230 325" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="400" y="313" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text></svg>