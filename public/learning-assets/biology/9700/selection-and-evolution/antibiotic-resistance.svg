<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Antibiotic resistance</title><desc id="desc">Pre-existing resistant variants survive antibiotic treatment and reproduce.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="90" width="190" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="135" y="147" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Variation</text><path d="M230 140 L320 140" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="275" y="128" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">antibiotic</text><rect x="320" y="90" width="210" height="100" rx="14" fill="#fee2e2" stroke="#1e3a8a" stroke-width="3"/><text x="425" y="147" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Susceptible die</text><rect x="600" y="90" width="230" height="100" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="715" y="147" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Resistant survive</text><path d="M715 190 L715 280" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="715" y="223" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">reproduce</text><rect x="570" y="280" width="290" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="715" y="337" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Resistance frequency rises</text></svg>