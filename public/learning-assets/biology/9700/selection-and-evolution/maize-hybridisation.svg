<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Maize inbreeding and hybridisation</title><desc id="desc">Two inbred lines are crossed to produce a uniform F1 hybrid that may show heterosis.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="50" y="110" width="240" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="170" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Inbred line A</text><rect x="610" y="110" width="240" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="730" y="167" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Inbred line B</text><path d="M290 160 L390 250" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="340" y="193" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cross</text><path d="M610 160 L510 250" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="560" y="193" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cross</text><rect x="330" y="250" width="240" height="100" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="307" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">F1 hybrid</text><text x="450" y="430" font-size="22" text-anchor="middle" font-family="Arial">Uniform F1; may show hybrid vigour (heterosis)</text></svg>