<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Hardy–Weinberg frequencies</title><desc id="desc">Allele frequencies p and q give genotype frequencies p squared, 2pq and q squared.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="70" y="90" width="220" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="180" y="142" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">p + q = 1</text><path d="M290 135 L360 135" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="325" y="123" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">square</text><rect x="360" y="90" width="470" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="595" y="142" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">p² + 2pq + q² = 1</text><text x="450" y="290" font-size="28" text-anchor="middle" font-family="Arial">AA = p²   Aa = 2pq   aa = q²</text><text x="450" y="370" font-size="20" text-anchor="middle" font-family="Arial">Assumes large population, random mating, no mutation, migration or selection</text></svg>