<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Founder and bottleneck effects</title><desc id="desc">Small samples of a source population can have allele frequencies that differ by chance.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="100" width="250" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="165" y="157" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Large source population</text><path d="M290 150 L390 150" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="340" y="138" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">few survivors/founders</text><rect x="390" y="100" width="190" height="100" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="485" y="157" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Small sample</text><path d="M580 150 L680 150" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="630" y="138" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">reproduces</text><rect x="680" y="100" width="180" height="100" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="770" y="157" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">New population</text><text x="450" y="320" font-size="23" text-anchor="middle" font-family="Arial">Allele frequencies may shift by chance; variation may be lost</text></svg>