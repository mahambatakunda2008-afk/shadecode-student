<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Crop disease resistance breeding</title><desc id="desc">A resistant donor is crossed with an elite crop variety, followed by selection and repeated crossing.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="100" width="200" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="140" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Resistant donor</text><rect x="660" y="100" width="200" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="760" y="152" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Elite crop</text><path d="M240 145 L330 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="285" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cross</text><path d="M660 145 L570 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="615" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cross</text><rect x="330" y="240" width="240" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="292" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Hybrid offspring</text><path d="M450 330 L450 390" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="450" y="348" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">select resistant</text><rect x="300" y="390" width="300" height="80" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="437" font-size="21" text-anchor="middle" fill="#0f172a" font-family="Arial">Improved variety</text></svg>