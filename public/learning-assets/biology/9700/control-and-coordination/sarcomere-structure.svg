<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Sarcomere structure</title><desc id="desc">Schematic sarcomere from Z line to Z line showing actin, myosin, A band, I band and H zone.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><path d="M110 150 V380 M790 150 V380" stroke="#334155" stroke-width="9"/><text x="110" y="125" font-size="22" text-anchor="middle" font-family="Arial">Z line</text><text x="790" y="125" font-size="22" text-anchor="middle" font-family="Arial">Z line</text><path d="M120 240 H450 M780 240 H450" stroke="#0f766e" stroke-width="10"/><path d="M260 300 H640" stroke="#b45309" stroke-width="20"/><path d="M260 280 V320 M640 280 V320" stroke="#b45309" stroke-width="5"/><text x="450" y="210" font-size="24" text-anchor="middle" font-family="Arial">Thin actin filaments</text><text x="450" y="355" font-size="24" text-anchor="middle" font-family="Arial">Thick myosin filament</text><text x="450" y="440" font-size="20" text-anchor="middle" font-family="Arial">A band spans myosin; I bands contain actin only; H zone contains myosin only</text></svg>