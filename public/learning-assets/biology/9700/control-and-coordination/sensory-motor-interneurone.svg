<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Sensory, intermediate and motor neurones</title><desc id="desc">Schematic pathway from receptor through sensory neurone and intermediate neurone to motor neurone and effector.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="210" width="150" height="80" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="115" y="257" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Receptor</text><path d="M190 250 L260 250" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="225" y="238" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">impulse</text><rect x="260" y="210" width="170" height="80" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="345" y="257" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Sensory neurone</text><path d="M430 250 L500 250" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="465" y="238" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="500" y="210" width="170" height="80" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="585" y="257" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Intermediate neurone</text><path d="M670 250 L730 250" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="700" y="238" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial"></text><rect x="730" y="210" width="130" height="80" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="795" y="257" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Moto