<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Neuromuscular junction and excitation</title><desc id="desc">Motor neurone releases acetylcholine at motor end plate; muscle action potential travels along sarcolemma and T-tubules.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="70" width="300" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="210" y="122" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Motor neurone terminal</text><path d="M210 160 L210 220" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="210" y="178" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">ACh</text><rect x="60" y="220" width="300" height="80" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="210" y="267" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Motor end plate</text><path d="M360 260 L500 260" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="430" y="248" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">muscle action potential</text><rect x="500" y="220" width="300" height="80" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="267" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Sarcolemma</text><path d="M650 300 L650 370" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="650" y="323" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">into T-tubule</text><rect x="500" y="370" width="300" height="80" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="417" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Sarcoplasmic reticulum</text><path d="M500 415 L400 415" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="450" y="403" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">Ca2+ release</text></svg>