<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Gibberellin in barley germination</title><desc id="desc">Embryo-derived gibberellin stimulates aleurone alpha-amylase; starch is hydrolysed to sugars for embryo growth.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="110" width="180" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="130" y="162" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Embryo</text><path d="M220 155 L300 155" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="260" y="143" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">gibberellin</text><rect x="300" y="110" width="180" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="390" y="162" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Aleurone layer</text><path d="M480 155 L560 155" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="520" y="143" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">α-amylase</text><rect x="560" y="110" width="180" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="162" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Endosperm starch</text><path d="M650 200 L650 290" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="650" y="233" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">hydrolysis</text><rect x="500" y="290" width="300" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="650" y="342" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Soluble sugars → embryo</text></svg>