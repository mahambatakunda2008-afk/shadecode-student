<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Taste-bud chemoreceptor pathway</title><desc id="desc">Dissolved tastant activates receptor cell, which stimulates a sensory neurone.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="70" y="110" width="220" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="180" y="162" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Dissolved tastant</text><path d="M180 200 L180 260" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="180" y="218" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">binds receptor</text><rect x="70" y="260" width="220" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="180" y="312" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Taste receptor cell</text><path d="M290 305 L410 305" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="350" y="293" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">neurotransmitter</text><rect x="410" y="260" width="210" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="515" y="312" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Sensory neurone</text><path d="M620 305 L730 305" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="675" y="293" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">action potentials</text><rect x="730" y="260" width="120" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="790" y="312" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">CNS</text></svg>