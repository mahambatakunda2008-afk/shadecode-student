<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Venus flytrap response</title><desc id="desc">Trigger hair stimulation produces electrical signals and rapid changes in lobe curvature, closing the trap.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="100" width="210" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="165" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Trigger hair touched</text><path d="M270 145 L350 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="310" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">electrical signal</text><rect x="350" y="100" width="210" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="455" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Leaf lobe response</text><path d="M560 145 L640 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="600" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">mechanical change</text><rect x="640" y="100" width="200" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="740" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Trap snaps shut</text><path d="M170 330 Q350 210 530 330 Q350 450 170 330" fill="#bbf7d0" stroke="#166534" stroke-width="5"/><path d="M350 330 L350 260" stroke="#166534" stroke-width="4"/><text x="350" y="480" font-size="20" text-anchor="middle" font-family="Arial">Modified leaf lobes change curvature</text></svg>