<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Sliding filament cross-bridge cycle</title><desc id="desc">Calcium exposes actin binding sites; myosin binds, pivots, detaches with ATP and re-cocks after ATP hydrolysis.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="40" y="90" width="190" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="135" y="142" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Ca2+ binds troponin</text><path d="M230 135 L300 135" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="265" y="123" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">moves tropomyosin</text><rect x="300" y="90" width="220" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="410" y="142" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Actin sites exposed</text><path d="M520 135 L590 135" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="555" y="123" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">myosin binds</text><rect x="590" y="90" width="250" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="715" y="142" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Cross-bridge / power stroke</text><path d="M715 180 L715 270" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="715" y="213" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">ATP binds</text><rect x="590" y="270" width="250" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="715" y="322" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Myosin detaches</text><path d="M590 315 L520 315" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="555" y="303" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">ATP hydrolysis</text><rect x="300" y="270" width="220" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="410" y="322" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Myosin re-cocked</text><path d="M410 270 L410 180" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="410" y="213" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">cycle repeats</text></svg>