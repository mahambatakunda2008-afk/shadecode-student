<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Auxin and cell-wall acidification</title><desc id="desc">Auxin stimulates plasma-membrane proton pumps; H+ enters the cell wall, lowering pH and allowing elongation.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="50" y="100" width="180" height="90" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="140" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Auxin</text><path d="M230 145 L310 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="270" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">stimulates</text><rect x="310" y="100" width="230" height="90" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="425" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">H+ proton pump</text><path d="M540 145 L620 145" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="580" y="133" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">H+ exported</text><rect x="620" y="100" width="220" height="90" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="730" y="152" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Acidified cell wall</text><path d="M730 190 L730 280" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="730" y="223" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">wall loosens</text><rect x="540" y="280" width="300" height="90" rx="14" fill="#fce7f3" stroke="#1e3a8a" stroke-width="3"/><text x="690" y="332" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Turgor-driven cell elongation</text></svg>