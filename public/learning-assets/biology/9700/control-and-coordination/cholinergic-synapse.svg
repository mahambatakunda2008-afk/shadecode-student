<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Cholinergic synapse</title><desc id="desc">Calcium entry triggers acetylcholine vesicle fusion; acetylcholine binds postsynaptic receptors.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="80" width="780" height="140" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="157" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Presynaptic terminal: vesicles contain acetylcholine</text><circle cx="180" cy="150" r="18" fill="#0f766e"/><circle cx="240" cy="150" r="18" fill="#0f766e"/><circle cx="300" cy="150" r="18" fill="#0f766e"/><path d="M420 30 L420 90" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="420" y="48" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">Ca2+ enters</text><rect x="60" y="250" width="780" height="45" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="450" y="280" font-size="20" text-anchor="middle" font-family="Arial">Synaptic cleft: ACh diffuses; acetylcholinesterase breaks it down</text><rect x="60" y="330" width="780" height="110" rx="14" fill="#dcfce7" stroke="#1e3a8a" stroke-width="3"/><text x="450" y="392" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Postsynaptic membrane: ACh receptors / ligand-gated channels</text><path d="M450 295 L450 330" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="450" y="300.5" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">ACh binds</text></svg>