<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Saltatory conduction</title><desc id="desc">Myelin insulates internodes; action potentials are regenerated at nodes of Ranvier.</desc><rect x="8" y="8" width="884" height="504" rx="22" fill="#f8fbff" stroke="#334155" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker></defs><rect x="60" y="190" width="180" height="110" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="150" y="252" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Node of Ranvier</text><rect x="240" y="205" width="180" height="80" rx="25" fill="#fde68a" stroke="#92400e" stroke-width="3"/><rect x="420" y="190" width="90" height="110" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><rect x="510" y="190" width="180" height="110" rx="14" fill="#fef3c7" stroke="#1e3a8a" stroke-width="3"/><text x="600" y="252" font-size="22" text-anchor="middle" fill="#0f172a" font-family="Arial">Node of Ranvier</text><rect x="690" y="205" width="150" height="80" rx="25" fill="#fde68a" stroke="#92400e" stroke-width="3"/><path d="M150 150 L590 150" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="370" y="138" font-size="17" text-anchor="middle" fill="#0f172a" font-family="Arial">local current beneath myelin</text><text x="330" y="340" font-size="20" text-anchor="middle" font-family="Arial">Myelin sheath</text><text x="600" y="370" font-size="20" text-anchor="middle" font-family="Arial">Impulse regenerated at nodes</text></svg>